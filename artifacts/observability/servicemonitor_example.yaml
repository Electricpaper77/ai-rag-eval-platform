# Example rendered ServiceMonitor used for Prometheus Operator discovery.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ai-rag-eval-metrics
  namespace: default
  labels:
    app.kubernetes.io/name: ai-rag-eval-api
    app.kubernetes.io/component: monitoring
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-rag-eval-api
      app.kubernetes.io/component: api
      monitoring: enabled
  namespaceSelector:
    matchNames:
      - default
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: 30s
