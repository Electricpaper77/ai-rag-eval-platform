name: AgentTrust Production CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  production-ci:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"
        cache-dependency-path: |
          requirements.txt
          requirements-lite.txt

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    - name: Python dependency sanity
      run: |
        python -m pip check

    - name: Python compilation
      run: |
        python -m compileall -q app backend gpu_platform scripts tests

    - name: Run regression evaluation
      run: |
        python scripts/run_regression_tests.py

    - name: Enforce release gates
      run: |
        python scripts/check_eval_thresholds.py --artifact runs/agenttrust_regression_eval.jsonl

    - name: Run full pytest suite
      run: |
        python -m pytest -q -m 'not postgres_integration' --basetemp .pytest_tmp

    - name: Build Docker image
      run: |
        docker build -t agenttrust-iq:${{ github.sha }} .

    - name: Preserve CI evidence artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: agenttrust-ci-evidence-${{ github.run_id }}
        if-no-files-found: ignore
        path: |
          runs/
          artifacts/
          docs/artifacts/
          .pytest_tmp/
