name: AI Evaluation Pipeline

on:
  push:
    branches: [ main ]

jobs:
  evaluation-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run regression evaluation
      run: |
        python scripts/run_regression_tests.py

    - name: Enforce eval thresholds
      run: |
        python scripts/check_eval_thresholds.py --artifact runs/agenttrust_regression_eval.jsonl

    - name: Run focused reliability validation
      run: |
        python -m pytest tests/test_agent_evaluation.py tests/test_security_guardrails.py tests/test_check_eval_thresholds.py -q
