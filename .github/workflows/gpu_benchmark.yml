name: GPU Benchmark

on:
  push:
    branches:
      - main

jobs:
  gpu-benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Start mock OpenAI-compatible endpoint
        run: |
          python - <<'PY' &
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer

          class Handler(BaseHTTPRequestHandler):
              def do_POST(self):
                  if self.path != "/v1/chat/completions":
                      self.send_response(404)
                      self.end_headers()
                      return
                  payload = json.dumps({
                      "id": "chatcmpl-ci",
                      "object": "chat.completion",
                      "choices": [{"index": 0, "message": {"role": "assistant", "content": "ok"}}],
                      "usage": {
                          "prompt_tokens": 52,
                          "completion_tokens": 128,
                          "total_tokens": 180,
                      },
                  }).encode("utf-8")
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(payload)))
                  self.end_headers()
                  self.wfile.write(payload)

              def log_message(self, format, *args):
                  return

          HTTPServer(("127.0.0.1", 8000), Handler).serve_forever()
          PY
          sleep 1

      - name: Run GPU benchmark
        env:
          BASE_URL: http://127.0.0.1:8000
          MODEL_NAME: mistralai/Mistral-7B-Instruct-v0.2
          NUM_REQUESTS: 5
          RUNTIME: vllm
        run: python scripts/run_gpu_benchmark.py

      - name: Validate GPU artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          jsonl_path = Path("artifacts/proof/gpu_benchmark_run.jsonl")
          summary_path = Path("artifacts/proof/gpu_summary.json")
          assert jsonl_path.exists(), "gpu_benchmark_run.jsonl missing"
          assert summary_path.exists(), "gpu_summary.json missing"

          rows = [json.loads(line) for line in jsonl_path.read_text(encoding="utf-8").splitlines() if line.strip()]
          assert rows, "gpu_benchmark_run.jsonl empty"
          latest = rows[-1]

          required = ["latency_ms", "prompt_tokens", "completion_tokens", "total_tokens", "tokens_per_sec", "runtime", "requests_per_sec"]
          missing = [field for field in required if field not in latest]
          assert not missing, f"missing fields in benchmark row: {missing}"
          assert latest["tokens_per_sec"] is not None, "tokens_per_sec missing"
          PY
