name: Gate 22E Operational Readiness
on:
  pull_request:
    branches: [main]
    paths: ["saas/**", "scripts/recovery_drill.py", "scripts/secure_backup.py", "tests/test_gate22e_*.py", ".github/workflows/gate22e-operational-readiness.yml", "docs/SAAS_*.md"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operational-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: gate22e, POSTGRES_DB: agenttrust}
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d agenttrust"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      AGENTTRUST_POSTGRES_URL: postgresql://postgres:gate22e@localhost:5432/agenttrust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Apply migrations
        run: python -c "from saas.postgres_repository import migrate; migrate()"
      - name: Operational readiness tests
        timeout-minutes: 10
        run: python -m pytest -q tests/test_gate22e_operational_readiness.py tests/test_gate22c_postgres_lifecycle.py tests/test_gate21_http_postgres.py
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate22e-operational-evidence
          path: artifacts/gate22d/
          if-no-files-found: ignore
