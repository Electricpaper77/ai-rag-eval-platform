name: Gate 15 Distributed Runtime Validation

on:
  workflow_dispatch:
  push:
    paths:
      - "distributed/**"
      - ".github/workflows/gate15-distributed-runtime-validation.yml"

permissions:
  contents: read

jobs:
  distributed-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version: "1.22"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install regression dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Record environment and commit
        run: |
          mkdir -p distributed/evidence
          git rev-parse HEAD | tee distributed/evidence/git_sha.txt
          go version | tee distributed/evidence/go_version.txt
          docker version | tee distributed/evidence/docker_version.txt
      - name: Go validation with exit codes
        shell: bash
        run: |
          set +e
          go -C distributed build ./... > distributed/evidence/go_build.txt 2>&1; echo $? > distributed/evidence/go_build.exit
          go -C distributed test ./... > distributed/evidence/go_test.txt 2>&1; echo $? > distributed/evidence/go_test.exit
          go -C distributed vet ./... > distributed/evidence/go_vet.txt 2>&1; echo $? > distributed/evidence/go_vet.exit
          CGO_ENABLED=1 go -C distributed test -race ./... > distributed/evidence/go_race.txt 2>&1; echo $? > distributed/evidence/go_race.exit
      - name: Compose scenarios and measured evidence
        shell: bash
        run: |
          set -o pipefail
          cd distributed
          trap 'docker compose logs --no-color > evidence/compose_logs.log 2>&1 || true; docker compose down -v || true' EXIT
          docker compose up --build -d 2>&1 | tee evidence/compose_up.log
          for endpoint in 18080 18081; do
            for attempt in $(seq 1 60); do curl -fsS "http://127.0.0.1:${endpoint}/healthz" > "evidence/worker_${endpoint}_health.json" && break; test "$attempt" = 60 && exit 1; sleep 0.5; done
          done
          curl -fsS http://127.0.0.1:18080/fanout > evidence/worker_communication.json
          python load_test.py --url http://127.0.0.1:18080/work --requests 200 --concurrency 1 > evidence/normal_load.json
          python load_test.py --url http://127.0.0.1:18080/work --requests 200 --concurrency 20 > evidence/concurrent_load.json
          python load_test.py --url http://127.0.0.1:18081/work --requests 40 --concurrency 10 > evidence/failure_injection_load.json
          recovery_start=$(date +%s%3N)
          for attempt in $(seq 1 100); do curl -fsS http://127.0.0.1:18081/work >/dev/null && break; test "$attempt" = 100 && exit 1; sleep 0.05; done
          recovery_end=$(date +%s%3N)
          python -c "import json; print(json.dumps({'recovery_time_ms': int('$recovery_end')-int('$recovery_start'), 'method':'first successful probe after injected failure'}))" > evidence/recovery.json
          printf '%s\n' 'workload: normal=200/c1, concurrent=200/c20, failure=40/c10; endpoint: local compose; GPU telemetry: simulated label only' > evidence/workload.txt
      - name: Existing evaluator regression
        shell: bash
        run: |
          set +e
          timeout 180s python -m pytest -q tests/test_agenttrust_demo.py tests/test_eval_harness.py tests/test_recruiter_evidence.py > distributed/evidence/evaluator_regression.txt 2>&1
          echo $? > distributed/evidence/evaluator_regression.exit
      - name: Enforce validation result
        shell: bash
        run: |
          test "$(cat distributed/evidence/go_build.exit)" = 0
          test "$(cat distributed/evidence/go_test.exit)" = 0
          test "$(cat distributed/evidence/go_vet.exit)" = 0
          test "$(cat distributed/evidence/go_race.exit)" = 0
          test "$(cat distributed/evidence/evaluator_regression.exit)" = 0
      - name: Upload Gate 15 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate15-distributed-runtime-evidence
          path: distributed/evidence/
