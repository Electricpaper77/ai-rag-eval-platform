name: Gate 23G Independent Product Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "saas/**"
      - "tests/test_gate23*.py"
      - "requirements-test.txt"
      - "docs/GATE23G_INDEPENDENT_ACCEPTANCE.md"
      - ".github/workflows/gate23g-independent-product-acceptance.yml"
  workflow_dispatch:

permissions: {contents: read}

jobs:
  independent-product-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: gate23g
          POSTGRES_DB: agenttrust
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d agenttrust"
          --health-interval=5s --health-timeout=5s --health-retries=24
    env:
      AGENTTRUST_POSTGRES_URL: postgresql://postgres:gate23g@localhost:5432/agenttrust
      AGENTTRUST_SAAS_DB: ""
      AGENTTRUST_SAAS_BACKEND: postgres
      AGENTTRUST_DEPLOYMENT_POLICY: test
      AGENTTRUST_SAAS_RUNTIME_MODE: test
      GATE23G_REQUIRED: "1"
      GATE23G_EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: Install shared test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt playwright
      - name: Install Chromium and axe-core
        run: |
          python -m playwright install --with-deps chromium
          npm install --no-save --ignore-scripts axe-core@4.10.2
      - name: Apply versioned PostgreSQL migrations
        run: python -c "from saas.postgres_repository import migrate; migrate()"
      - name: Initialize sanitized evidence
        run: |
          mkdir -p artifacts/gate23g
          printf '{"schema":"gate23g-evidence-v1","status":"started","synthetic_only":true,"commit_sha":"%s"}\n' "$GATE23G_EVIDENCE_SHA" > artifacts/gate23g/run-state.json
      - name: Require all Gate 23G tests to collect
        run: |
          python -m pytest --collect-only -q tests/test_gate23g_acceptance.py -m postgres_integration | tee artifacts/gate23g/collection.txt
          test "$(grep -c '::test_gate23g_' artifacts/gate23g/collection.txt)" -eq 3
      - name: Run mandatory PostgreSQL Chromium acceptance
        run: |
          set +e
          timeout 600s python -m pytest -q tests/test_gate23g_acceptance.py -m postgres_integration --maxfail=1 > artifacts/gate23g/pytest.txt 2>&1
          status=$?
          echo "$status" > artifacts/gate23g/pytest.exit
          cat artifacts/gate23g/pytest.txt
          exit "$status"
      - name: Verify complete sanitized evidence
        if: success()
        run: |
          test -f artifacts/gate23g/http-acceptance.json
          test -f artifacts/gate23g/browser-acceptance.json
          test -f artifacts/gate23g/pytest.exit
          test "$(find artifacts/gate23g -name 'gate23g-*.png' | wc -l)" -eq 4
          test "$(cat artifacts/gate23g/pytest.exit)" -eq 0
      - name: Upload sanitized Gate 23G evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate23g-independent-product-acceptance
          path: artifacts/gate23g/
          if-no-files-found: error
