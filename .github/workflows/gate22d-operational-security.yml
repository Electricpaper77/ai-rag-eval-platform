name: Gate 22D Operational Security
on:
  pull_request:
    branches: [main]
    paths: ["saas/**", "scripts/secure_backup.py", "tests/test_gate22d_*.py", ".github/workflows/gate22d-operational-security.yml", "docs/SAAS_*.md"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operational-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: gate22d, POSTGRES_DB: agenttrust}
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d agenttrust"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      AGENTTRUST_POSTGRES_URL: postgresql://postgres:gate22d@localhost:5432/agenttrust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Apply migrations
        run: python -c "from saas.postgres_repository import migrate; migrate()"
      - name: Gate 22D security tests
        timeout-minutes: 5
        run: python -m pytest -q tests/test_gate22d_operational_security.py tests/test_gate22c_lifecycle.py tests/test_gate22c_postgres_lifecycle.py
      - name: Upload sanitized recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate22d-operational-evidence
          path: artifacts/gate22d/
          if-no-files-found: ignore
