name: Gate 1 Kubernetes Runtime

on:
  workflow_dispatch:
    inputs:
      feature_sha:
        description: "Full SHA of the approved feature commit to validate"
        required: true
        type: string

permissions:
  contents: read

jobs:
  gate1-k8s:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out approved feature commit
        uses: actions/checkout@v4
        with:
          repository: Electricpaper77/ai-rag-eval-platform
          ref: ${{ inputs.feature_sha }}
          fetch-depth: 0

      - name: Validate requested commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.feature_sha }}" =~ ^[0-9a-fA-F]{40}$ ]]
          git cat-file -e "${{ inputs.feature_sha }}^{commit}"
          test "$(git rev-parse HEAD)" = "${{ inputs.feature_sha }}"
          test "$(git remote get-url origin | sed 's#\.git$##')" = "https://github.com/Electricpaper77/ai-rag-eval-platform"

      - name: Install Python dependencies
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements-lite.txt

      - name: Install pinned kind release
        shell: bash
        run: |
          set -euo pipefail
          KIND_VERSION=v0.27.0
          curl -fsSLo kind-linux-amd64 "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          curl -fsSLo kind.sha256sum "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64.sha256sum"
          sha256sum -c kind.sha256sum
          mkdir -p "$HOME/.local/bin"
          install -m 0755 kind-linux-amd64 "$HOME/.local/bin/kind"
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          command -v kind
          kind version

      - name: Create isolated cluster
        run: |
          kind create cluster --name agenttrust-amd-g1 --wait 120s
          kubectl cluster-info
          kubectl get nodes -o wide

      - name: Build and load AgentTrust IQ image
        run: |
          docker build -t agenttrust-iq:ci .
          kind load docker-image agenttrust-iq:ci --name agenttrust-amd-g1

      - name: Deploy Gate 1 workloads
        run: kubectl apply -f k8s/gate1-ci.yaml

      - name: Verify interactive pod
        run: |
          kubectl wait -n agenttrust-gate1 --for=condition=Ready pod/agenttrust-dev --timeout=120s
          kubectl get pod -n agenttrust-gate1 agenttrust-dev -o yaml

      - name: Verify CI and benchmark Jobs
        run: |
          set -euo pipefail
          for job in agenttrust-ci agenttrust-benchmark; do
            kubectl patch -n agenttrust-gate1 job "$job" --type=merge -p '{"spec":{"ttlSecondsAfterFinished":600}}'
          done
          wait_for_job() {
            local job="$1"
            for _ in $(seq 1 300); do
              complete="$(kubectl get -n agenttrust-gate1 job "$job" -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}')"
              failed="$(kubectl get -n agenttrust-gate1 job "$job" -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}')"
              if [[ "$complete" == "True" ]]; then
                kubectl logs -n agenttrust-gate1 job/"$job"
                return 0
              fi
              if [[ "$failed" == "True" ]]; then
                kubectl describe -n agenttrust-gate1 job "$job"
                kubectl logs -n agenttrust-gate1 job/"$job" --all-containers=true --prefix=true || true
                return 1
              fi
              sleep 1
            done
            kubectl describe -n agenttrust-gate1 job "$job"
            kubectl logs -n agenttrust-gate1 job/"$job" --all-containers=true --prefix=true || true
            return 1
          }
          wait_for_job agenttrust-ci
          wait_for_job agenttrust-benchmark

      - name: Verify inference service and limits
        run: |
          kubectl rollout status -n agenttrust-gate1 deployment/agenttrust-inference --timeout=180s
          kubectl run -n agenttrust-gate1 inference-client --rm -i --restart=Never --image=agenttrust-iq:ci --image-pull-policy=Never -- python -c "import urllib.request; response=urllib.request.urlopen('http://agenttrust-inference:8080/', timeout=10); print(response.status); print(response.read(200).decode())"
          kubectl get deployment,pod,service,networkpolicy -n agenttrust-gate1 -o yaml

      - name: Controlled failure and recovery
        run: |
          kubectl apply -f - <<'YAML'
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: agenttrust-recovery
            namespace: agenttrust-gate1
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 60
            template:
              spec:
                restartPolicy: Never
                automountServiceAccountToken: false
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 10001
                  runAsGroup: 10001
                  seccompProfile: {type: RuntimeDefault}
                containers:
                  - name: recovery
                    image: agenttrust-iq:ci
                    imagePullPolicy: Never
                    command: ["python", "-c", "raise SystemExit(1)"]
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities: {drop: [ALL]}
                    resources:
                      requests: {cpu: 100m, memory: 128Mi}
                      limits: {cpu: 250m, memory: 256Mi}
          YAML
          kubectl wait -n agenttrust-gate1 --for=condition=failed job/agenttrust-recovery --timeout=120s
          kubectl apply -f - <<'YAML'
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: agenttrust-recovery-success
            namespace: agenttrust-gate1
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 60
            template:
              spec:
                restartPolicy: Never
                automountServiceAccountToken: false
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 10001
                  runAsGroup: 10001
                  seccompProfile: {type: RuntimeDefault}
                containers:
                  - name: recovery
                    image: agenttrust-iq:ci
                    imagePullPolicy: Never
                    command: ["python", "-c", "print('recovered')"]
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities: {drop: [ALL]}
                    resources:
                      requests: {cpu: 100m, memory: 128Mi}
                      limits: {cpu: 250m, memory: 256Mi}
          YAML
          kubectl wait -n agenttrust-gate1 --for=condition=complete job/agenttrust-recovery-success --timeout=120s
          kubectl logs -n agenttrust-gate1 job/agenttrust-recovery
          kubectl logs -n agenttrust-gate1 job/agenttrust-recovery-success

      - name: Run regression safeguards
        run: python -m pytest -q tests/test_workload_platform.py tests/test_platform_jobs.py

      - name: Collect evidence on failure
        if: always()
        run: |
          mkdir -p artifacts/gate1-k8s
          kubectl get all,networkpolicy -n agenttrust-gate1 -o yaml > artifacts/gate1-k8s/resources.yaml || true
          kubectl get events -n agenttrust-gate1 --sort-by=.lastTimestamp > artifacts/gate1-k8s/events.txt || true
          kubectl logs -n agenttrust-gate1 job/agenttrust-ci > artifacts/gate1-k8s/ci.log 2>&1 || true
          kubectl logs -n agenttrust-gate1 job/agenttrust-benchmark > artifacts/gate1-k8s/benchmark.log 2>&1 || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate1-kubernetes-evidence
          path: artifacts/gate1-k8s
