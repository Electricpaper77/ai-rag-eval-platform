name: Gate 5 Observability SLO

on:
  push:
    branches:
      - feature/gate5-observability-slo
    paths:
      - "backend/**"
      - "scripts/gate1_inference.py"
      - "deploy/helm/agenttrust/**"
      - "deploy/observability/**"
      - "tests/test_gate5_observability.py"
      - ".github/workflows/gate5-observability.yml"
      - "Dockerfile"
      - "requirements.txt"
  workflow_dispatch:
    inputs:
      feature_sha:
        description: Full feature commit SHA to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  gate5-observability:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      KIND_VERSION: v0.27.0
      HELM_VERSION: v3.22.0
      PROMETHEUS_CHART_VERSION: 29.37.0
      PROMETHEUS_IMAGE: v3.15.0
      GRAFANA_CHART_VERSION: 10.5.15
      LOKI_CHART_VERSION: 7.3.0
      ALLOY_CHART_VERSION: 1.13.1
      CLUSTER_NAME: agenttrust-gate5
      NAMESPACE: agenttrust
      OBS_NAMESPACE: observability
      IMAGE: agenttrust-iq:gate5

    steps:
      - name: Checkout exact feature commit
        uses: actions/checkout@v4
        with:
          repository: Electricpaper77/ai-rag-eval-platform
          ref: ${{ inputs.feature_sha || github.sha }}
          fetch-depth: 0

      - name: Prepare evidence directory
        run: mkdir -p artifacts/gate5

      - name: Validate checkout identity
        shell: bash
        run: |
          set -euo pipefail
          requested="${{ inputs.feature_sha }}"
          if [[ -n "$requested" ]]; then
            [[ "$requested" =~ ^[0-9a-fA-F]{40}$ ]]
            test "$(git rev-parse HEAD)" = "$requested"
          else
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          fi
          test "$(git remote get-url origin | sed 's#\.git$##')" = "https://github.com/Electricpaper77/ai-rag-eval-platform"
          git rev-parse HEAD | tee artifacts/gate5/feature-sha.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install application and test dependencies
        run: python -m pip install --no-cache-dir -r requirements.txt

      - name: Install pinned kind
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo kind-linux-amd64 "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          curl -fsSLo kind.sha256sum "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64.sha256sum"
          sha256sum -c kind.sha256sum
          mkdir -p "$HOME/.local/bin"
          install -m 0755 kind-linux-amd64 "$HOME/.local/bin/kind"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          kind version | tee artifacts/gate5/kind-version.txt

      - name: Install pinned Helm
        shell: bash
        run: |
          set -euo pipefail
          archive="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl -fsSLo "$archive" "https://get.helm.sh/$archive"
          curl -fsSLo "$archive.sha256sum" "https://get.helm.sh/$archive.sha256sum"
          sha256sum -c "$archive.sha256sum"
          tar -xzf "$archive"
          mkdir -p "$HOME/.local/bin"
          install -m 0755 linux-amd64/helm "$HOME/.local/bin/helm"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          helm version | tee artifacts/gate5/helm-version.txt

      - name: Validate chart, rules, dashboard and SLO files
        shell: bash
        run: |
          set -euo pipefail
          helm lint deploy/helm/agenttrust | tee artifacts/gate5/helm-lint.txt
          python -m pytest --noconftest -q tests/test_gate5_observability.py | tee artifacts/gate5/focused-tests.txt
          docker pull "prom/prometheus:${PROMETHEUS_IMAGE}"
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace:ro" \
            --entrypoint promtool \
            "prom/prometheus:${PROMETHEUS_IMAGE}" \
            check rules /workspace/deploy/observability/prometheus/alerting_rules.yaml \
            | tee artifacts/gate5/promtool-rules.txt

      - name: Create isolated kind cluster
        shell: bash
        run: |
          set -euo pipefail
          kind create cluster --name "$CLUSTER_NAME" --wait 180s
          kubectl get nodes -o wide | tee artifacts/gate5/cluster-nodes.txt
          kubectl create namespace "$NAMESPACE"
          kubectl create namespace "$OBS_NAMESPACE"

      - name: Build and load AgentTrust image
        shell: bash
        run: |
          set -euo pipefail
          docker build -t "$IMAGE" . | tee artifacts/gate5/image-build.txt
          kind load docker-image "$IMAGE" --name "$CLUSTER_NAME"
          docker image inspect "$IMAGE" --format='{{.Id}} {{json .RepoDigests}}' \
            | tee artifacts/gate5/image-id.txt

      - name: Install Prometheus
        shell: bash
        run: |
          set -euo pipefail
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          rules_json="$(python -c 'import json, yaml; print(json.dumps(yaml.safe_load(open("deploy/observability/prometheus/alerting_rules.yaml", encoding="utf-8"))))')"
          helm upgrade --install prometheus prometheus-community/prometheus \
            --version "$PROMETHEUS_CHART_VERSION" \
            --namespace "$OBS_NAMESPACE" \
            -f deploy/observability/prometheus/values.yaml \
            --set-json "serverFiles.alerting_rules\\.yml=${rules_json}" \
            --wait --timeout 300s | tee artifacts/gate5/prometheus-install.txt

      - name: Install Loki, Alloy and Grafana
        shell: bash
        run: |
          set -euo pipefail
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update
          helm upgrade --install loki grafana/loki \
            --version "$LOKI_CHART_VERSION" \
            --namespace "$OBS_NAMESPACE" \
            -f deploy/observability/loki/values.yaml \
            --wait --timeout 300s | tee artifacts/gate5/loki-install.txt
          helm upgrade --install alloy grafana/alloy \
            --version "$ALLOY_CHART_VERSION" \
            --namespace "$OBS_NAMESPACE" \
            -f deploy/observability/alloy/values.yaml \
            --wait --timeout 300s | tee artifacts/gate5/alloy-install.txt
          helm upgrade --install grafana grafana/grafana \
            --version "$GRAFANA_CHART_VERSION" \
            --namespace "$OBS_NAMESPACE" \
            -f deploy/observability/grafana/values.yaml \
            --wait --timeout 300s | tee artifacts/gate5/grafana-install.txt

      - name: Install AgentTrust with observability enabled
        shell: bash
        run: |
          set -euo pipefail
          helm upgrade --install agenttrust deploy/helm/agenttrust \
            --namespace "$NAMESPACE" \
            --set image.repository=agenttrust-iq \
            --set image.tag=gate5 \
            --set image.pullPolicy=Never \
            --set observability.metrics.enabled=true \
            --set observability.monitoringNamespace="$OBS_NAMESPACE" \
            --wait --timeout 300s | tee artifacts/gate5/agenttrust-install.txt

      - name: Wait for observability workloads
        shell: bash
        run: |
          set -euo pipefail
          for resource in $(kubectl get deployment,statefulset,daemonset -n "$OBS_NAMESPACE" -o name); do
            kubectl rollout status -n "$OBS_NAMESPACE" "$resource" --timeout=300s
          done
          kubectl get pods -n "$OBS_NAMESPACE" -o wide | tee artifacts/gate5/observability-pods-ready.txt
          kubectl get pods -n "$NAMESPACE" -o wide | tee artifacts/gate5/agenttrust-pods-ready.txt

      - name: Provision Grafana dashboard
        shell: bash
        run: |
          set -euo pipefail
          kubectl create configmap agenttrust-dashboard \
            --namespace "$OBS_NAMESPACE" \
            --from-file=agenttrust-dashboard.json=deploy/observability/grafana/agenttrust-dashboard.json \
            --dry-run=client -o yaml > artifacts/gate5/dashboard-configmap.yaml
          kubectl label --local -f artifacts/gate5/dashboard-configmap.yaml \
            grafana_dashboard=1 -o yaml | kubectl apply -f -
          found=false
          for _ in $(seq 1 60); do
            result="$(kubectl run gate5-grafana-check -n "$NAMESPACE" --rm -i --restart=Never \
              --image="$IMAGE" --image-pull-policy=Never -- \
              python -c 'import base64,json,urllib.parse,urllib.request; p=base64.b64encode(b"admin:gate5-ci-only").decode(); q=urllib.parse.urlencode({"query":"AgentTrust Observability SLO"}); r=urllib.request.Request("http://grafana.observability.svc.cluster.local:80/api/search?"+q,headers={"Authorization":"Basic "+p}); d=json.load(urllib.request.urlopen(r,timeout=10)); print("DASHBOARD_FOUND" if any(x.get("title")=="AgentTrust Observability SLO" for x in d) else "DASHBOARD_WAIT")' 2>/dev/null || true)"
            printf '%s\n' "$result" | tee artifacts/gate5/grafana-dashboard-poll.txt
            if grep -q DASHBOARD_FOUND <<<"$result"; then found=true; break; fi
            sleep 2
          done
          test "$found" = true

      - name: Prove Prometheus target and baseline SLO
        shell: bash
        run: |
          set -euo pipefail
          kubectl run gate5-baseline-client -n "$NAMESPACE" --rm -i --restart=Never \
            --labels=app.kubernetes.io/part-of=agenttrust-iq \
            --image="$IMAGE" --image-pull-policy=Never -- \
            python -c 'import json,time,urllib.request; b="http://agenttrust.agenttrust.svc.cluster.local:8080"; [urllib.request.urlopen(b+"/healthz",timeout=10).read() for _ in range(20)]; [urllib.request.urlopen(urllib.request.Request(b+"/v1/chat/completions",data=json.dumps({"model":"mock","messages":[{"role":"user","content":"gate5 baseline"}]}).encode(),headers={"content-type":"application/json"}),timeout=15).read() for _ in range(20)]; print("BASELINE_TRAFFIC_PASS")' \
            | tee artifacts/gate5/baseline-traffic.txt
          sleep 20
          kubectl run gate5-prometheus-client -n "$OBS_NAMESPACE" --rm -i --restart=Never \
            --labels=app.kubernetes.io/part-of=agenttrust-iq \
            --image="$IMAGE" --image-pull-policy=Never -- \
            python -c 'import json,urllib.parse,urllib.request; base="http://prometheus-server.observability.svc.cluster.local:80"; qs={"up":"up{job=\"agenttrust\"}","availability":"sum(increase(http_requests_total{job=\"agenttrust\",path=\"/v1/chat/completions\",status=~\"2..\"}[5m])) / clamp_min(sum(increase(http_requests_total{job=\"agenttrust\",path=\"/v1/chat/completions\"}[5m])),1)","error_rate":"sum(increase(http_requests_total{job=\"agenttrust\",path=\"/v1/chat/completions\",status=~\"5..\"}[5m])) / clamp_min(sum(increase(http_requests_total{job=\"agenttrust\",path=\"/v1/chat/completions\"}[5m])),1)","p95":"histogram_quantile(0.95,sum(increase(http_request_duration_seconds_bucket{job=\"agenttrust\",path=\"/v1/chat/completions\"}[5m])) by (le))"}; out={k:json.load(urllib.request.urlopen(base+"/api/v1/query?"+urllib.parse.urlencode({"query":q}),timeout=10)) for k,q in qs.items()}; print(json.dumps(out)); val=lambda k:float(out[k]["data"]["result"][0]["value"][1]) if out[k]["data"]["result"] else 0.0; assert val("up")==1 and val("availability")>=0.99 and val("error_rate")<0.01 and val("p95")<1.0' \
            | tee artifacts/gate5/baseline-prometheus-queries.txt
          grep -q '"status":"success"' artifacts/gate5/baseline-prometheus-queries.txt
          kubectl run gate5-alert-baseline -n "$OBS_NAMESPACE" --rm -i --restart=Never \
            --labels=app.kubernetes.io/part-of=agenttrust-iq \
            --image="$IMAGE" --image-pull-policy=Never -- \
            python -c 'import json,urllib.request; a=json.load(urllib.request.urlopen("http://prometheus-server.observability.svc.cluster.local:80/api/v1/alerts",timeout=10))["data"]["alerts"]; bad=[x["labels"].get("alertname") for x in a if x["labels"].get("alertname"," ").startswith("AgentTrust") and x["state"]=="firing"]; print("BASELINE_ALERTS_INACTIVE",bad); assert not bad' \
            | tee artifacts/gate5/baseline-alerts.txt

      - name: Prove Loki ingestion
        shell: bash
        run: |
          set -euo pipefail
          found=false
          for _ in $(seq 1 60); do
            result="$(kubectl run gate5-loki-client -n "$NAMESPACE" --rm -i --restart=Never \
              --labels=app.kubernetes.io/part-of=agenttrust-iq \
              --image="$IMAGE" --image-pull-policy=Never -- \
              python -c 'import json,urllib.parse,urllib.request; q=urllib.parse.urlencode({"query":"{namespace=\"agenttrust\",app=\"agenttrust\"}","limit":"20"}); d=json.load(urllib.request.urlopen("http://loki.observability.svc.cluster.local:3100/loki/api/v1/query_range?"+q,timeout=10)); print("LOKI_LOGS_FOUND" if d.get("data",{}).get("result") else "LOKI_WAIT")' 2>/dev/null || true)"
            printf '%s\n' "$result" | tee -a artifacts/gate5/loki-query.txt
            if grep -q LOKI_LOGS_FOUND <<<"$result"; then found=true; break; fi
            sleep 2
          done
          test "$found" = true

      - name: Prove restrictive NetworkPolicy behavior
        shell: bash
        run: |
          set -euo pipefail
          kubectl run gate5-approved-client -n "$NAMESPACE" --rm -i --restart=Never \
            --labels=app.kubernetes.io/part-of=agenttrust-iq \
            --image="$IMAGE" --image-pull-policy=Never -- \
            python -c 'import urllib.request; assert urllib.request.urlopen("http://agenttrust.agenttrust.svc.cluster.local:8080/healthz",timeout=10).status==200; print("APPROVED_CLIENT_PASS")' \
            | tee artifacts/gate5/networkpolicy-approved.txt
          kubectl create namespace untrusted --dry-run=client -o yaml | kubectl apply -f -
          set +e
          kubectl run gate5-denied-client -n untrusted --rm -i --restart=Never \
            --image="$IMAGE" --image-pull-policy=Never -- \
            python -c 'import urllib.request; urllib.request.urlopen("http://agenttrust.agenttrust.svc.cluster.local:8080/healthz",timeout=5); raise SystemExit("UNEXPECTED_NETWORK_ACCESS")' \
            > artifacts/gate5/networkpolicy-denied.txt 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -q -E 'timed out|UNEXPECTED_NETWORK_ACCESS|Connection refused|Name or service not known' artifacts/gate5/networkpolicy-denied.txt

      - name: Inject deterministic error incident
        shell: bash
        run: |
          set -euo pipefail
          incident_start="$(date +%s)"
          helm upgrade --install agenttrust deploy/helm/agenttrust -n "$NAMESPACE" \
            --set image.repository=agenttrust-iq --set image.tag=gate5 --set image.pullPolicy=Never \
            --set observability.metrics.enabled=true --set observability.monitoringNamespace="$OBS_NAMESPACE" \
            --set env.GATE5_FORCE_ERRORS=true --wait --timeout 300s \
            | tee artifacts/gate5/incident-enable.txt
          kubectl run gate5-error-client -n "$NAMESPACE" --rm -i --restart=Never \
            --labels=app.kubernetes.io/part-of=agenttrust-iq \
            --image="$IMAGE" --image-pull-policy=Never -- \
            python -c 'import http.client,json; p=json.dumps({"model":"mock","messages":[{"role":"user","content":"gate5 incident"}]}).encode(); statuses=[(lambda c:(c.request("POST","/v1/chat/completions",p,{"Content-Type":"application/json"}),c.getresponse().status,c.close())[1])(http.client.HTTPConnection("agenttrust.agenttrust.svc.cluster.local",8080,timeout=10)) for _ in range(20)]; assert statuses==[500]*20, statuses; print("FORCED_500_COUNT",len(statuses))' \
            | tee artifacts/gate5/incident-traffic.txt
          detected=false
          for _ in $(seq 1 60); do
            result="$(kubectl run gate5-alert-error-check -n "$OBS_NAMESPACE" --rm -i --restart=Never \
              --labels=app.kubernetes.io/part-of=agenttrust-iq \
              --image="$IMAGE" --image-pull-policy=Never -- \
              python -c 'import json,sys,urllib.request; a=json.load(urllib.request.urlopen("http://prometheus-server.observability.svc.cluster.local:80/api/v1/alerts",timeout=10))["data"]["alerts"]; print("STATE=firing" if any(x["labels"].get("alertname")=="AgentTrustHighErrorRate" and x["state"]=="firing" for x in a) else "STATE=inactive")' 2>/dev/null || true)"
            printf '%s\n' "$result" | tee -a artifacts/gate5/incident-alert-poll.txt
            if grep -q 'STATE=firing' <<<"$result"; then detected=true; break; fi
            sleep 2
          done
          test "$detected" = true
          detected_at="$(date +%s)"
          printf 'detection_seconds=%s\n' "$((detected_at-incident_start))" | tee artifacts/gate5/incident-timing.txt

      - name: Recover and prove alert resolution
        shell: bash
        run: |
          set -euo pipefail
          recovery_start="$(date +%s)"
          helm upgrade --install agenttrust deploy/helm/agenttrust -n "$NAMESPACE" \
            --set image.repository=agenttrust-iq --set image.tag=gate5 --set image.pullPolicy=Never \
            --set observability.metrics.enabled=true --set observability.monitoringNamespace="$OBS_NAMESPACE" \
            --set env.GATE5_FORCE_ERRORS=false --wait --timeout 300s \
            | tee artifacts/gate5/recovery-rollout.txt
          kubectl run gate5-recovery-client -n "$NAMESPACE" --rm -i --restart=Never \
            --labels=app.kubernetes.io/part-of=agenttrust-iq \
            --image="$IMAGE" --image-pull-policy=Never -- \
            python -c 'import json,urllib.request; b="http://agenttrust.agenttrust.svc.cluster.local:8080"; assert urllib.request.urlopen(b+"/healthz",timeout=10).status==200; p=json.dumps({"model":"mock","messages":[{"role":"user","content":"gate5 recovery"}]}).encode(); r=urllib.request.urlopen(urllib.request.Request(b+"/v1/chat/completions",data=p,headers={"content-type":"application/json"}),timeout=15); assert r.status==200; print("RECOVERY_INFERENCE_PASS",r.status)' \
            | tee artifacts/gate5/recovery-inference.txt
          resolved=false
          for _ in $(seq 1 90); do
            result="$(kubectl run gate5-alert-recovery-check -n "$OBS_NAMESPACE" --rm -i --restart=Never \
              --labels=app.kubernetes.io/part-of=agenttrust-iq \
              --image="$IMAGE" --image-pull-policy=Never -- \
              python -c 'import json,urllib.request; a=json.load(urllib.request.urlopen("http://prometheus-server.observability.svc.cluster.local:80/api/v1/alerts",timeout=10))["data"]["alerts"]; print("STATE=resolved" if not any(x["labels"].get("alertname")=="AgentTrustHighErrorRate" and x["state"]=="firing" for x in a) else "STATE=firing")' 2>/dev/null || true)"
            printf '%s\n' "$result" | tee -a artifacts/gate5/recovery-alert-poll.txt
            if grep -q 'STATE=resolved' <<<"$result"; then resolved=true; break; fi
            sleep 2
          done
          test "$resolved" = true
          recovery_end="$(date +%s)"
          printf 'recovery_seconds=%s\n' "$((recovery_end-recovery_start))" | tee artifacts/gate5/recovery-timing.txt

      - name: Verify live security controls
        shell: bash
        run: |
          set -euo pipefail
          kubectl get deployment agenttrust -n "$NAMESPACE" -o json > artifacts/gate5/agenttrust-deployment.json
          python - <<'PY' | tee artifacts/gate5/security-check.txt
          import json
          deployment = json.load(open("artifacts/gate5/agenttrust-deployment.json", encoding="utf-8"))
          pod = deployment["spec"]["template"]["spec"]
          container = pod["containers"][0]
          assert pod["automountServiceAccountToken"] is False
          assert pod["securityContext"]["runAsNonRoot"] is True
          assert pod["securityContext"]["runAsUser"] == 10001
          assert pod["securityContext"]["runAsGroup"] == 10001
          assert pod["securityContext"]["seccompProfile"]["type"] == "RuntimeDefault"
          assert container["securityContext"]["readOnlyRootFilesystem"] is True
          assert container["securityContext"]["allowPrivilegeEscalation"] is False
          assert container["securityContext"]["capabilities"]["drop"] == ["ALL"]
          assert container["resources"]["requests"] and container["resources"]["limits"]
          print("AGENTTRUST_SECURITY_PASS")
          PY
          kubectl get pods -n "$OBS_NAMESPACE" -o json | python -c 'import json,sys; d=json.load(sys.stdin); bad=[c["name"] for p in d["items"] for c in p["spec"]["containers"] if c.get("securityContext",{}).get("privileged") is True]; assert not bad, bad; print("OBSERVABILITY_PRIVILEGE_CHECK_PASS")' \
            | tee artifacts/gate5/observability-security-check.txt

      - name: Run full regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --basetemp .pytest_tmp | tee artifacts/gate5/full-regression.txt

      - name: Collect Gate 5 evidence
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/gate5
          kubectl get all,networkpolicy -n "$NAMESPACE" -o yaml > artifacts/gate5/agenttrust-resources.yaml 2>&1 || true
          kubectl get all,configmap,secret -n "$OBS_NAMESPACE" -o yaml > artifacts/gate5/observability-resources.yaml 2>&1 || true
          kubectl get pods -A -o wide > artifacts/gate5/pods-final.txt 2>&1 || true
          kubectl get events -A --sort-by=.lastTimestamp > artifacts/gate5/events-final.txt 2>&1 || true
          kubectl logs -n "$NAMESPACE" deployment/agenttrust --all-containers --tail=300 > artifacts/gate5/agenttrust-logs.txt 2>&1 || true
          prometheus_pod="$(kubectl get pods -n "$OBS_NAMESPACE" -l app.kubernetes.io/name=prometheus,app.kubernetes.io/component=server -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
          if [[ -n "$prometheus_pod" ]]; then
            kubectl logs -n "$OBS_NAMESPACE" "$prometheus_pod" -c prometheus-server --tail=300 > artifacts/gate5/prometheus-logs.txt 2>&1 || true
            kubectl logs -n "$OBS_NAMESPACE" "$prometheus_pod" -c prometheus-server --previous --tail=300 > artifacts/gate5/prometheus-logs-previous.txt 2>&1 || true
            kubectl describe pod -n "$OBS_NAMESPACE" "$prometheus_pod" > artifacts/gate5/prometheus-pod-describe.txt 2>&1 || true
          fi
          kubectl logs -n "$OBS_NAMESPACE" daemonset/alloy --all-containers --tail=300 > artifacts/gate5/alloy-logs.txt 2>&1 || true
          kubectl logs -n "$OBS_NAMESPACE" statefulset/loki-single-binary --all-containers --tail=300 > artifacts/gate5/loki-logs.txt 2>&1 || true
          kubectl logs -n "$OBS_NAMESPACE" pod/loki-0 -c loki --tail=300 > artifacts/gate5/loki-pod-logs.txt 2>&1 || true
          kubectl logs -n "$OBS_NAMESPACE" pod/loki-0 -c loki --previous --tail=300 > artifacts/gate5/loki-pod-logs-previous.txt 2>&1 || true
          kubectl describe pod -n "$OBS_NAMESPACE" loki-0 > artifacts/gate5/loki-pod-describe.txt 2>&1 || true
          helm list -A > artifacts/gate5/helm-list.txt 2>&1 || true
          {
            echo "KIND_VERSION=$KIND_VERSION"
            echo "HELM_VERSION=$HELM_VERSION"
            echo "PROMETHEUS_CHART_VERSION=$PROMETHEUS_CHART_VERSION"
            echo "PROMETHEUS_IMAGE=$PROMETHEUS_IMAGE"
            echo "GRAFANA_CHART_VERSION=$GRAFANA_CHART_VERSION"
            echo "LOKI_CHART_VERSION=$LOKI_CHART_VERSION"
            echo "ALLOY_CHART_VERSION=$ALLOY_CHART_VERSION"
          } > artifacts/gate5/stack-versions.txt

      - name: Upload Gate 5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate5-observability-evidence
          path: artifacts/gate5
          if-no-files-found: error

      - name: Delete isolated kind cluster
        if: always()
        run: kind delete cluster --name "$CLUSTER_NAME" || true

