name: Gate 38 Linux Regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate38-linux-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout selected diagnostic commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install declared test dependencies
        run: python -m pip install --requirement requirements-test.txt

      - name: Record Linux test environment
        run: |
          python --version
          python -m pip show fastapi starlette anyio httpx pytest
          git rev-parse HEAD

      - name: Run Gate 38 regression modules
        run: |
          python -m pytest -vv --maxfail=1 \
            tests/test_outage_eval.py \
            tests/test_reliability_engineering.py \
            tests/test_model_routing.py \
            tests/test_multi_model_routing.py \
            tests/test_vllm_provider.py \
            tests/test_agent_evaluation.py \
            tests/test_regression_eval.py

      - name: Upload diagnostic test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate38-linux-regression-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            .pytest_cache/
            artifacts/outage_eval/
