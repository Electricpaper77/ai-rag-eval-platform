name: Gate 25 Non-Production v1.1.0-rc.1 Release Verification

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "saas/**"
      - "scripts/gate25_release_manifest.py"
      - "tests/test_gate23g_acceptance.py"
      - "tests/test_gate24_release_candidate.py"
      - "tests/test_gate25_release_verification.py"
      - "docs/GATE23G_INDEPENDENT_ACCEPTANCE.md"
      - "docs/GATE24_MVP_RELEASE_CANDIDATE.md"
      - "docs/GATE25_V1_RELEASE_VERIFICATION.md"
      - "docs/RELEASE_NOTES_V1_1_RC1.md"
      - "release/agenttrust-iq-v1.1.0-rc.1.md"
      - "requirements-test.txt"
      - "pytest.ini"
      - ".github/workflows/gate25-v1-release-verification.yml"
  workflow_dispatch:

permissions: {contents: read}

jobs:
  release-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: gate25
          POSTGRES_DB: agenttrust
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d agenttrust"
          --health-interval=5s --health-timeout=5s --health-retries=24
    env:
      AGENTTRUST_POSTGRES_URL: postgresql://postgres:gate25@localhost:5432/agenttrust
      AGENTTRUST_SAAS_DB: ""
      AGENTTRUST_SAAS_BACKEND: postgres
      AGENTTRUST_DEPLOYMENT_POLICY: test
      AGENTTRUST_SAAS_RUNTIME_MODE: test
      GATE23G_REQUIRED: "1"
      GATE25_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GATE25_BASELINE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
      GATE25_RELEASE_IDENTITY: v1.1.0-rc.1
      GATE25_WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GATE25_BROWSER: Chromium headless
      GATE25_POSTGRES_VERSION: postgres:16 disposable service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: Initialize evidence directories
        run: |
          mkdir -p artifacts/gate23g artifacts/gate24 artifacts/gate25
          printf '%s\n' '{"schema":"gate25-evidence-v1","synthetic_only":true,"status":"started"}' > artifacts/gate25/run-state.json
      - name: Install pinned release-test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt playwright
      - name: Install Chromium and axe-core
        run: |
          python -m playwright install --with-deps chromium
          npm install --no-save --ignore-scripts axe-core@4.10.2
      - name: Apply versioned PostgreSQL migrations
        run: python -c "from saas.postgres_repository import migrate; migrate()"
      - name: Require Gate 23G collection
        run: |
          set +e
          python -m pytest --collect-only -q tests/test_gate23g_acceptance.py -m postgres_integration | tee artifacts/gate23g/collection.txt
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > artifacts/gate23g/collection.exit
          set -e
          test "$status" -eq 0
          test "$(grep -c '::test_gate23g_' artifacts/gate23g/collection.txt)" -eq 3
      - name: Run real FastAPI PostgreSQL Chromium acceptance
        run: |
          set +e
          timeout 600s python -m pytest -q tests/test_gate23g_acceptance.py -m postgres_integration --maxfail=1 > artifacts/gate23g/pytest.txt 2>&1
          status=$?
          printf '%s\n' "$status" > artifacts/gate23g/pytest.exit
          cat artifacts/gate23g/pytest.txt
          exit "$status"
      - name: Require Gate 24 collection
        run: |
          set +e
          python -m pytest --collect-only -q tests/test_gate24_release_candidate.py -m release_candidate | tee artifacts/gate24/collection.txt
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > artifacts/gate24/collection.exit
          set -e
          test "$status" -eq 0
          test "$(grep -c '::test_gate24_' artifacts/gate24/collection.txt)" -eq 3
      - name: Run Gate 24 release evidence contract
        run: |
          set +e
          python -m pytest -q tests/test_gate24_release_candidate.py -m release_candidate --maxfail=1 > artifacts/gate24/pytest.txt 2>&1
          status=$?
          printf '%s\n' "$status" > artifacts/gate24/pytest.exit
          cat artifacts/gate24/pytest.txt
          exit "$status"
      - name: Build and validate Gate 25 manifest
        run: |
          python scripts/gate25_release_manifest.py --output artifacts/gate25/release-manifest.json
          python -m pytest -q tests/test_gate25_release_verification.py -m release_candidate
          sha256sum artifacts/gate25/release-manifest.json > artifacts/gate25/release-manifest.sha256
      - name: Verify mandatory sanitized evidence
        run: |
          test "$(cat artifacts/gate23g/pytest.exit)" -eq 0
          test "$(cat artifacts/gate24/pytest.exit)" -eq 0
          test -f artifacts/gate23g/http-acceptance.json
          test -f artifacts/gate23g/browser-acceptance.json
          test -f artifacts/gate25/release-manifest.json
          test "$(find artifacts/gate23g -name 'gate23g-*.png' | wc -l)" -eq 4
          grep -q '"synthetic_only": true' artifacts/gate25/release-manifest.json
          grep -q "$GATE25_SOURCE_SHA" artifacts/gate25/release-manifest.json
      - name: Upload sanitized Gate 25 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate25-v1.1.0-rc1-release-verification
          path: |
            artifacts/gate23g/
            artifacts/gate24/
            artifacts/gate25/
          if-no-files-found: error
