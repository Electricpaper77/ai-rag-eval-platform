name: Gate 4 Terraform Foundation

on:
  push:
    branches:
      - feature/gate4-terraform-infra
    paths:
      - "infra/terraform/gcp/**"
      - "tests/test_gate4_terraform.py"
      - ".github/workflows/gate4-terraform.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TERRAFORM_VERSION: "1.9.8"
      TFLINT_VERSION: "v0.55.1"
      CHECKOV_VERSION: "3.2.350"
      TF_ROOT: infra/terraform/gcp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare evidence directory
        run: mkdir -p artifacts/gate4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned test runner
        run: python -m pip install --no-cache-dir "pytest==8.3.5"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Install pinned TFLint
        shell: bash
        run: |
          set -euo pipefail
          archive="tflint_linux_amd64.zip"
          curl -fsSLo "$archive" "https://github.com/terraform-linters/tflint/releases/download/${TFLINT_VERSION}/$archive"
          curl -fsSLo tflint_checksums.txt "https://github.com/terraform-linters/tflint/releases/download/${TFLINT_VERSION}/checksums.txt"
          grep "  $archive$" tflint_checksums.txt | sha256sum -c -
          unzip -q "$archive"
          sudo install -m 0755 tflint /usr/local/bin/tflint
          tflint --version

      - name: Install pinned Checkov
        run: python -m pip install --no-cache-dir "checkov==${CHECKOV_VERSION}"

      - name: Terraform fmt check
        shell: bash
        run: |
          set -euo pipefail
          terraform fmt -check -recursive "$TF_ROOT" | tee artifacts/gate4/terraform-fmt.txt

      - name: Terraform init without backend
        shell: bash
        working-directory: ${{ env.TF_ROOT }}
        run: |
          set -euo pipefail
          terraform init -backend=false -input=false | tee "${GITHUB_WORKSPACE}/artifacts/gate4/terraform-init.txt"

      - name: Terraform validate
        shell: bash
        working-directory: ${{ env.TF_ROOT }}
        run: |
          set -euo pipefail
          terraform validate | tee "${GITHUB_WORKSPACE}/artifacts/gate4/terraform-validate.txt"

      - name: Deterministic Terraform assertions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_gate4_terraform.py | tee artifacts/gate4/terraform-tests.txt

      - name: TFLint
        shell: bash
        working-directory: ${{ env.TF_ROOT }}
        run: |
          set -euo pipefail
          tflint --init | tee "${GITHUB_WORKSPACE}/artifacts/gate4/tflint-init.txt"
          tflint --recursive --format compact | tee "${GITHUB_WORKSPACE}/artifacts/gate4/tflint.txt"

      - name: Checkov security scan
        shell: bash
        run: |
          set -euo pipefail
          set +e
          checkov -d "$TF_ROOT" --framework terraform --output json --soft-fail > artifacts/gate4/checkov.json
          checkov_status=$?
          set -e
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("artifacts/gate4/checkov.json").read_text(encoding="utf-8"))
          failed = report.get("results", {}).get("failed_checks", [])
          material = [
              item for item in failed
              if str(item.get("severity", "")).upper() in {"HIGH", "CRITICAL"}
          ]
          Path("artifacts/gate4/checkov-summary.txt").write_text(
              f"failed_checks={len(failed)}\nhigh_critical={len(material)}\n",
              encoding="utf-8",
          )
          print(f"checkov_failed_checks={len(failed)}")
          print(f"checkov_high_critical={len(material)}")
          if material:
              raise SystemExit("unresolved high/critical Checkov findings")
          PY
          test "$checkov_status" -eq 0 -o -s artifacts/gate4/checkov.json

      - name: Terraform plan without refresh
        shell: bash
        working-directory: ${{ env.TF_ROOT }}
        run: |
          set +e
          terraform plan -refresh=false -input=false \
            -var="project_id=agenttrust-gate4-validation" \
            > "${GITHUB_WORKSPACE}/artifacts/gate4/terraform-plan.txt" 2>&1
          plan_status=$?
          set -e
          cat "${GITHUB_WORKSPACE}/artifacts/gate4/terraform-plan.txt"
          if [[ "$plan_status" -eq 0 ]]; then
            echo "PLAN: PASS" | tee "${GITHUB_WORKSPACE}/artifacts/gate4/plan-summary.txt"
          elif grep -Eiq 'application default credentials|could not find default credentials|oauth2|authentication|access token|credential' "${GITHUB_WORKSPACE}/artifacts/gate4/terraform-plan.txt"; then
            echo "PLAN: HOLD — authentication/provider limitation" | tee "${GITHUB_WORKSPACE}/artifacts/gate4/plan-summary.txt"
          else
            echo "PLAN: FAIL — non-authentication error" | tee "${GITHUB_WORKSPACE}/artifacts/gate4/plan-summary.txt"
            exit "$plan_status"
          fi

      - name: Record versions and module tree
        if: always()
        shell: bash
        run: |
          {
            terraform version
            tflint --version
            checkov --version
          } > artifacts/gate4/tool-versions.txt 2>&1
          find infra/terraform/gcp -maxdepth 4 -type f -not -path '*/.terraform/*' | sort \
            > artifacts/gate4/module-tree.txt
          grep -E 'provider "google"|version = "= 6.12.0"' infra/terraform/gcp/versions.tf \
            > artifacts/gate4/provider-lock-summary.txt
          git diff --check > artifacts/gate4/git-diff-check.txt

      - name: Upload Gate 4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate4-terraform-evidence
          path: artifacts/gate4
          if-no-files-found: error
