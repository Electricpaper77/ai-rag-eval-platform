name: Gate 7 Distributed Inference

on:
  push:
    branches:
      - feature/gate7-distributed-inference
    paths:
      - ".github/workflows/gate7-distributed-inference.yml"
      - "backend/app/distributed/**"
      - "backend/app/main.py"
      - "deploy/distributed/**"
      - "scripts/gate7_*.py"
      - "tests/test_gate7_distributed.py"
      - "Dockerfile"
      - "requirements*.txt"
  workflow_dispatch:
    inputs:
      feature_sha:
        description: Full feature commit SHA to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  gate7-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FEATURE_SHA: ${{ inputs.feature_sha || github.sha }}
      KIND_VERSION: v0.27.0
      CLUSTER_NAME: agenttrust-gate7
      NAMESPACE: gate7-distributed
      IMAGE: agenttrust-iq:gate7
      ROUTER_URL: http://gate7-router:8080/platform/distributed/chat

    steps:
      - name: Checkout exact feature SHA
        uses: actions/checkout@v4
        with:
          repository: Electricpaper77/ai-rag-eval-platform
          ref: ${{ env.FEATURE_SHA }}
          fetch-depth: 0

      - name: Validate repository identity and SHA
        run: |
          set -euo pipefail
          [[ "$FEATURE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$FEATURE_SHA"
          git cat-file -e "$FEATURE_SHA^{commit}"
          test "$(git remote get-url origin | sed 's#\.git$##')" = "https://github.com/Electricpaper77/ai-rag-eval-platform"
          mkdir -p artifacts/gate7
          {
            echo "repository=$(git remote get-url origin)"
            echo "feature_sha=$FEATURE_SHA"
            git show -s --format='commit=%H%nsubject=%s' "$FEATURE_SHA"
          } | tee artifacts/gate7/identity.txt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements-lite.txt

      - name: Run Gate 7 focused tests
        run: python -m pytest -q tests/test_gate7_distributed.py | tee artifacts/gate7/focused-tests.txt

      - name: Install pinned kind
        run: |
          set -euo pipefail
          curl -fsSLo kind-linux-amd64 "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          curl -fsSLo kind.sha256sum "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64.sha256sum"
          sha256sum -c kind.sha256sum
          mkdir -p "$HOME/.local/bin"
          install -m 0755 kind-linux-amd64 "$HOME/.local/bin/kind"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          kind version | tee artifacts/gate7/kind-version.txt

      - name: Create kind cluster
        run: |
          set -euo pipefail
          kind create cluster --name "$CLUSTER_NAME" --wait 120s
          kubectl version --client=true | tee artifacts/gate7/kubectl-version.txt
          kubectl get nodes -o wide | tee artifacts/gate7/nodes.txt

      - name: Build and load AgentTrust image
        run: |
          set -euo pipefail
          docker build -t "$IMAGE" . | tee artifacts/gate7/docker-build.txt
          kind load docker-image "$IMAGE" --name "$CLUSTER_NAME"
          docker image inspect "$IMAGE" --format '{{.Id}}' | tee artifacts/gate7/image-id.txt

      - name: Deploy router and two workers
        run: |
          set -euo pipefail
          kubectl apply -f deploy/distributed/gate7.yaml
          kubectl rollout status -n "$NAMESPACE" deployment/gate7-router --timeout=180s
          kubectl rollout status -n "$NAMESPACE" deployment/gate7-worker --timeout=180s
          kubectl wait -n "$NAMESPACE" --for=condition=Ready pod -l app.kubernetes.io/name=gate7-worker --timeout=180s
          kubectl get pods,svc,networkpolicy -n "$NAMESPACE" -o wide | tee artifacts/gate7/initial-state.txt

      - name: Verify worker discovery and security
        run: |
          set -euo pipefail
          kubectl exec -n "$NAMESPACE" deploy/gate7-router -- python -c 'import json,urllib.request; d=json.load(urllib.request.urlopen("http://127.0.0.1:8080/platform/distributed/status",timeout=10)); print(json.dumps(d,indent=2)); assert d["healthy_count"] >= 2' | tee artifacts/gate7/worker-discovery.txt
          kubectl get deploy -n "$NAMESPACE" -o json > artifacts/gate7/deployments.json
          python - <<'PY'
          import json
          data=json.load(open("artifacts/gate7/deployments.json", encoding="utf-8"))
          assert len(data["items"]) == 2
          for deployment in data["items"]:
              spec=deployment["spec"]["template"]["spec"]
              assert spec["automountServiceAccountToken"] is False
              pod_sc=spec["securityContext"]
              assert pod_sc["runAsNonRoot"] is True and pod_sc["runAsUser"] == 10001 and pod_sc["runAsGroup"] == 10001
              assert pod_sc["seccompProfile"]["type"] == "RuntimeDefault"
              container=spec["containers"][0]
              sc=container["securityContext"]
              assert sc["allowPrivilegeEscalation"] is False and sc["readOnlyRootFilesystem"] is True
              assert sc["capabilities"]["drop"] == ["ALL"]
              assert container["resources"]["requests"] and container["resources"]["limits"]
          print("SECURITY: PASS")
          PY

      - name: Baseline distributed inference and benchmark
        run: |
          set -euo pipefail
          kubectl run -n "$NAMESPACE" gate7-baseline --labels=app.kubernetes.io/part-of=agenttrust-iq --rm -i --restart=Never --image="$IMAGE" --image-pull-policy=Never -- python -m scripts.gate7_distributed_benchmark --url "$ROUTER_URL" --phase baseline --requests 100 --concurrency 10 --min-workers 2 --require-success --output /tmp/baseline.json | tee artifacts/gate7/baseline-benchmark.txt
          kubectl run -n "$NAMESPACE" gate7-baseline-short --labels=app.kubernetes.io/part-of=agenttrust-iq --rm -i --restart=Never --image="$IMAGE" --image-pull-policy=Never -- python -m scripts.gate7_distributed_benchmark --url "$ROUTER_URL" --phase distribution-proof --requests 30 --concurrency 10 --min-workers 2 --require-success --output /tmp/distribution.json | tee artifacts/gate7/distribution-proof.txt

      - name: Delete one worker and prove failover
        run: |
          set -euo pipefail
          worker_pod="$(kubectl get pods -n "$NAMESPACE" -l app.kubernetes.io/name=gate7-worker -o jsonpath='{.items[0].metadata.name}')"
          worker_id="$worker_pod"
          printf 'failed_worker_pod=%s\nfailed_worker_id=%s\n' "$worker_pod" "$worker_id" | tee artifacts/gate7/failure-event.txt
          kubectl delete pod -n "$NAMESPACE" "$worker_pod" --wait=false
          failed_seen=false
          for _ in $(seq 1 90); do
            status_json="$(kubectl exec -n "$NAMESPACE" deploy/gate7-router -- python -c 'import json,urllib.request; print(urllib.request.urlopen("http://127.0.0.1:8080/platform/distributed/status",timeout=5).read().decode())')"
            echo "$status_json" > artifacts/gate7/degraded-status.json
            if FAILED_WORKER="$worker_id" STATUS_JSON="$status_json" python - <<'PY'
          import json, os
          data=json.loads(os.environ["STATUS_JSON"])
          failed=os.environ["FAILED_WORKER"]
          assert any(w["worker_id"] == failed and not (w["health"] == "healthy" and w["readiness"] == "ready" and w["state"] == "healthy") for w in data["workers"])
          assert data["healthy_count"] >= 1
          PY
            then failed_seen=true; break; fi
            sleep 1
          done
          test "$failed_seen" = true
          cat artifacts/gate7/degraded-status.json
          kubectl run -n "$NAMESPACE" gate7-degraded --labels=app.kubernetes.io/part-of=agenttrust-iq --rm -i --restart=Never --image="$IMAGE" --image-pull-policy=Never -- python -m scripts.gate7_distributed_benchmark --url "$ROUTER_URL" --phase degraded --requests 50 --concurrency 8 --min-workers 1 --require-success --output /tmp/degraded.json | tee artifacts/gate7/degraded-benchmark.txt
          FAILED_WORKER="$worker_id" python - <<'PY'
          import json, os, re
          text=open("artifacts/gate7/degraded-benchmark.txt", encoding="utf-8").read()
          summary=json.loads(re.search(r"DISTRIBUTION_SUMMARY (.+)", text).group(1))
          assert summary["failed_requests"] == 0
          assert os.environ["FAILED_WORKER"] not in summary["per_worker_request_counts"]
          print("FAILOVER: PASS")
          PY

      - name: Prove worker recovery and recovered distribution
        run: |
          set -euo pipefail
          kubectl rollout status -n "$NAMESPACE" deployment/gate7-worker --timeout=180s
          recovered=false
          for _ in $(seq 1 90); do
            status_json="$(kubectl exec -n "$NAMESPACE" deploy/gate7-router -- python -c 'import json,urllib.request; print(urllib.request.urlopen("http://127.0.0.1:8080/platform/distributed/status",timeout=5).read().decode())')"
            echo "$status_json" > artifacts/gate7/recovered-status.json
            if STATUS_JSON="$status_json" python - <<'PY'
          import json, os
          data=json.loads(os.environ["STATUS_JSON"])
          assert data["healthy_count"] >= 2
          PY
            then recovered=true; break; fi
            sleep 1
          done
          test "$recovered" = true
          cat artifacts/gate7/recovered-status.json
          kubectl run -n "$NAMESPACE" gate7-recovered --labels=app.kubernetes.io/part-of=agenttrust-iq --rm -i --restart=Never --image="$IMAGE" --image-pull-policy=Never -- python -m scripts.gate7_distributed_benchmark --url "$ROUTER_URL" --phase recovered --requests 100 --concurrency 10 --min-workers 2 --require-success --output /tmp/recovered.json | tee artifacts/gate7/recovered-benchmark.txt
          kubectl exec -n "$NAMESPACE" deploy/gate7-router -- python -c 'import urllib.request; print(urllib.request.urlopen("http://127.0.0.1:8080/metrics").read().decode())' > artifacts/gate7/router-metrics.txt

      - name: Prove approved and denied network paths
        run: |
          set -euo pipefail
          kubectl run -n "$NAMESPACE" gate7-approved --labels=app.kubernetes.io/part-of=agenttrust-iq --rm -i --restart=Never --image="$IMAGE" --image-pull-policy=Never -- python -c 'import urllib.request; r=urllib.request.urlopen("http://gate7-router:8080/healthz",timeout=10); print("approved_router",r.status); assert r.status == 200' | tee artifacts/gate7/network-approved.txt
          kubectl create namespace gate7-denied
          if kubectl run -n gate7-denied gate7-denied-client --rm -i --restart=Never --image="$IMAGE" --image-pull-policy=Never -- python -c 'import urllib.request; urllib.request.urlopen("http://gate7-worker-headless.gate7-distributed.svc.cluster.local:8080/healthz",timeout=5)'; then
            echo "NetworkPolicy denied path unexpectedly succeeded" >&2
            exit 1
          else
            echo "NETWORK_POLICY_DENIED: PASS" | tee artifacts/gate7/network-denied.txt
          fi
          kubectl delete namespace gate7-denied --wait=true

      - name: Full regression suite
        run: python -m pytest -q | tee artifacts/gate7/full-regression.txt

      - name: Collect Gate 7 evidence
        if: always()
        run: |
          set +e
          mkdir -p artifacts/gate7
          kubectl get pods,deploy,svc,networkpolicy -n "$NAMESPACE" -o yaml > artifacts/gate7/final-resources.yaml 2>&1
          kubectl get events -n "$NAMESPACE" --sort-by=.lastTimestamp > artifacts/gate7/events.txt 2>&1
          kubectl logs -n "$NAMESPACE" deployment/gate7-router --tail=500 > artifacts/gate7/router-logs.txt 2>&1
          kubectl logs -n "$NAMESPACE" deployment/gate7-worker --tail=500 > artifacts/gate7/worker-logs.txt 2>&1
          kubectl describe pods -n "$NAMESPACE" > artifacts/gate7/pod-describe.txt 2>&1
          kubectl describe networkpolicy -n "$NAMESPACE" > artifacts/gate7/networkpolicy-describe.txt 2>&1
          git diff --check > artifacts/gate7/diff-check.txt 2>&1
          git status --short --branch > artifacts/gate7/git-status.txt 2>&1
          git log -1 --format='%H %s' > artifacts/gate7/git-head.txt 2>&1
          set -e

      - name: Upload Gate 7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate7-distributed-inference-evidence
          path: artifacts/gate7
          if-no-files-found: error

      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name "$CLUSTER_NAME"
