name: Gate 2 Kubernetes Runtime

on:
  workflow_dispatch:
    inputs:
      feature_sha:
        description: Full feature commit SHA to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  gate2-k8s:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout requested feature commit
        uses: actions/checkout@v4
        with:
          repository: Electricpaper77/ai-rag-eval-platform
          ref: ${{ inputs.feature_sha }}
          fetch-depth: 0
      - name: Validate exact checkout
        run: |
          set -euo pipefail
          [[ "${{ inputs.feature_sha }}" =~ ^[0-9a-fA-F]{40}$ ]]
          git cat-file -e "${{ inputs.feature_sha }}^{commit}"
          test "$(git rev-parse HEAD)" = "${{ inputs.feature_sha }}"
          test "$(git remote get-url origin | sed 's#\.git$##')" = "https://github.com/Electricpaper77/ai-rag-eval-platform"
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install --no-cache-dir httpx==0.28.1
      - name: Install pinned kind
        run: |
          set -euo pipefail
          version=v0.27.0
          curl -fsSLo kind-linux-amd64 "https://kind.sigs.k8s.io/dl/${version}/kind-linux-amd64"
          curl -fsSLo kind.sha256sum "https://kind.sigs.k8s.io/dl/${version}/kind-linux-amd64.sha256sum"
          sha256sum -c kind.sha256sum
          mkdir -p "$HOME/.local/bin"
          install -m 0755 kind-linux-amd64 "$HOME/.local/bin/kind"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          kind version
      - name: Create isolated kind cluster
        run: |
          kind create cluster --name agenttrust-gate2 --wait 120s
          kubectl get nodes -o wide
      - name: Build and load AgentTrust image
        run: |
          docker build -t agenttrust-iq:gate2 .
          kind load docker-image agenttrust-iq:gate2 --name agenttrust-gate2
      - name: Generate and apply Gate 2 manifests
        run: |
          mkdir -p artifacts/gate2
          python -m scripts.gate2_render --output artifacts/gate2/generated.yaml
          kubectl apply -f artifacts/gate2/generated.yaml
          kubectl get all,networkpolicy -n agenttrust-gate2 -o yaml > artifacts/gate2/applied.yaml
      - name: Verify generated workloads
        run: |
          set -euo pipefail
          kubectl wait -n agenttrust-gate2 --for=condition=Ready pod/gate2-dev --timeout=120s
          kubectl wait -n agenttrust-gate2 --for=condition=complete job/gate2-ci --timeout=180s
          kubectl wait -n agenttrust-gate2 --for=condition=complete job/gate2-benchmark --timeout=180s
          kubectl rollout status -n agenttrust-gate2 deployment/gate2-inference --timeout=180s
          kubectl logs -n agenttrust-gate2 job/gate2-ci | tee artifacts/gate2/ci.log
          kubectl logs -n agenttrust-gate2 job/gate2-benchmark | tee artifacts/gate2/benchmark.log
          kubectl logs -n agenttrust-gate2 pod/gate2-dev > artifacts/gate2/dev.log
          kubectl get -n agenttrust-gate2 pod,job,deploy,svc,networkpolicy -o yaml > artifacts/gate2/resources.yaml
          kubectl exec -n agenttrust-gate2 deploy/gate2-inference -- python -c "import urllib.request; print(urllib.request.urlopen('http://localhost:8080/healthz').read().decode())"
      - name: Verify inference and recovery
        run: |
          set -euo pipefail
          kubectl run -n agenttrust-gate2 inference-client --labels=app.kubernetes.io/part-of=agenttrust-iq --rm -i --restart=Never --image=agenttrust-iq:gate2 --image-pull-policy=Never -- python -c "import json,urllib.request; r=urllib.request.urlopen('http://gate2-inference:8080/healthz'); print('healthz',r.status); q=urllib.request.Request('http://gate2-inference:8080/v1/chat/completions',data=json.dumps({'model':'mock','messages':[{'role':'user','content':'hello'}]}).encode(),headers={'content-type':'application/json'}); b=json.loads(urllib.request.urlopen(q).read()); assert b['choices'][0]['message']['role']=='assistant'; print('inference',b)" | tee artifacts/gate2/inference.log
          kubectl create namespace agenttrust-gate2-denied
          if kubectl run -n agenttrust-gate2-denied deny-client --rm -i --restart=Never --image=agenttrust-iq:gate2 --image-pull-policy=Never -- python -c "import urllib.request; urllib.request.urlopen('http://gate2-inference.agenttrust-gate2.svc:8080/healthz',timeout=5)"; then exit 1; fi
          kubectl delete namespace agenttrust-gate2-denied --wait=true
          old_pod="$(kubectl get pods -n agenttrust-gate2 -l app.kubernetes.io/name=gate2-inference -o jsonpath='{.items[0].metadata.name}')"
          old_uid="$(kubectl get pod -n agenttrust-gate2 "$old_pod" -o jsonpath='{.metadata.uid}')"
          printf 'old_pod=%s old_uid=%s\n' "$old_pod" "$old_uid" | tee artifacts/gate2/recovery.log
          kubectl delete pod -n agenttrust-gate2 "$old_pod" --wait=false
          new_pod=""
          new_uid=""
          for _ in $(seq 1 120); do
            for candidate in $(kubectl get pods -n agenttrust-gate2 -l app.kubernetes.io/name=gate2-inference -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}'); do
              candidate_uid="$(kubectl get pod -n agenttrust-gate2 "$candidate" -o jsonpath='{.metadata.uid}')"
              if [[ "$candidate_uid" != "$old_uid" ]]; then new_pod="$candidate"; new_uid="$candidate_uid"; break; fi
            done
            [[ -n "$new_pod" ]] && break
            sleep 1
          done
          test -n "$new_pod"
          test "$new_uid" != "$old_uid"
          kubectl wait -n agenttrust-gate2 --for=condition=Ready pod/"$new_pod" --timeout=120s
          printf 'new_pod=%s new_uid=%s\n' "$new_pod" "$new_uid" | tee -a artifacts/gate2/recovery.log
          kubectl run -n agenttrust-gate2 recovery-client --labels=app.kubernetes.io/part-of=agenttrust-iq --rm -i --restart=Never --image=agenttrust-iq:gate2 --image-pull-policy=Never -- python -c "import json,urllib.request; r=urllib.request.urlopen('http://gate2-inference:8080/healthz'); print('healthz',r.status); q=urllib.request.Request('http://gate2-inference:8080/v1/chat/completions',data=json.dumps({'model':'mock','messages':[{'role':'user','content':'recovery'}]}).encode(),headers={'content-type':'application/json'}); b=json.loads(urllib.request.urlopen(q).read()); assert b['choices'][0]['message']['role']=='assistant'; print('recovery',b)" | tee -a artifacts/gate2/recovery.log
      - name: Verify benchmark artifact
        run: |
          grep -F "'total_cases': 9" artifacts/gate2/benchmark.log
          grep -Fx 'artifact=/tmp/eval_runs/regression_gate2-benchmark.jsonl' artifacts/gate2/benchmark.log
      - name: PVC capability probe
        run: |
          kubectl get storageclass > artifacts/gate2/storageclass.txt
          if ! kubectl get storageclass standard >/dev/null 2>&1; then echo "PVC_BLOCKED=no standard kind storage class" | tee artifacts/gate2/pvc.log; exit 0; fi
          kubectl apply -f - <<'YAML'
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata: {name: gate2-pvc, namespace: agenttrust-gate2}
          spec:
            accessModes: [ReadWriteOnce]
            resources: {requests: {storage: 1Mi}}
            storageClassName: standard
          YAML
          kubectl apply -f - <<'YAML'
          apiVersion: batch/v1
          kind: Job
          metadata: {name: gate2-pvc-writer, namespace: agenttrust-gate2}
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
                containers:
                - name: writer
                  image: agenttrust-iq:gate2
                  imagePullPolicy: Never
                  command: [python, -c, "from pathlib import Path; Path('/mnt/agenttrust/marker').write_text('gate2-persistent')"]
                  securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
                  resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 100m, memory: 128Mi}}
                  volumeMounts: [{name: workdir, mountPath: /mnt/agenttrust}]
                volumes: [{name: workdir, persistentVolumeClaim: {claimName: gate2-pvc}}]
          YAML
          kubectl wait -n agenttrust-gate2 --for=condition=complete job/gate2-pvc-writer --timeout=120s
          kubectl delete job gate2-pvc-writer -n agenttrust-gate2 --wait=true
          kubectl run -n agenttrust-gate2 gate2-pvc-reader --rm -i --restart=Never --image=agenttrust-iq:gate2 --image-pull-policy=Never --overrides='{"spec":{"securityContext":{"runAsNonRoot":true,"runAsUser":10001,"runAsGroup":10001,"seccompProfile":{"type":"RuntimeDefault"}},"containers":[{"name":"gate2-pvc-reader","image":"agenttrust-iq:gate2","imagePullPolicy":"Never","command":["python","-c","from pathlib import Path; assert Path(\"/mnt/agenttrust/marker\").read_text() == \"gate2-persistent\"; print(\"PVC_PERSISTED\")"],"securityContext":{"allowPrivilegeEscalation":false,"readOnlyRootFilesystem":true,"capabilities":{"drop":["ALL"]}},"volumeMounts":[{"name":"workdir","mountPath":"/mnt/agenttrust"}],"resources":{"requests":{"cpu":"50m","memory":"64Mi"},"limits":{"cpu":"100m","memory":"128Mi"}}}],"volumes":[{"name":"workdir","persistentVolumeClaim":{"claimName":"gate2-pvc"}}]}}' | tee artifacts/gate2/pvc.log
      - name: Focused tests
        run: python -m pytest -q tests/test_workload_platform.py
      - name: Collect evidence
        if: always()
        run: |
          mkdir -p artifacts/gate2
          kubectl get events -n agenttrust-gate2 --sort-by=.lastTimestamp > artifacts/gate2/events.txt || true
          kubectl get all,networkpolicy -n agenttrust-gate2 -o yaml > artifacts/gate2/final-resources.yaml || true
      - name: Upload Gate 2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate2-kubernetes-evidence
          path: artifacts/gate2
