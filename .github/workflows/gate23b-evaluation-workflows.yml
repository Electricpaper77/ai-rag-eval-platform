name: Gate 23B Evaluation Workflows
on:
  pull_request:
    branches: [main]
    paths: ["frontend/**", "saas/**", "tests/test_gate23b_*.py", ".github/workflows/gate23b-evaluation-workflows.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  evaluation-workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: gate23b
          POSTGRES_DB: agenttrust
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d agenttrust"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      AGENTTRUST_POSTGRES_URL: postgresql://postgres:gate23b@localhost:5432/agenttrust
      AGENTTRUST_SAAS_DB: ""
      AGENTTRUST_SAAS_BACKEND: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check -r requirements-test.txt playwright
      - run: python -m playwright install --with-deps chromium
      - name: Apply PostgreSQL migrations
        run: python -c "from saas.postgres_repository import migrate; migrate()"
      - name: Contract, security and authenticated browser journey
        run: timeout 240s python -m pytest -q tests/test_gate23b_contract.py tests/test_gate23b_browser.py
      - name: Upload sanitized Gate 23B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate23b-evaluation-evidence
          path: artifacts/gate23b/
          if-no-files-found: error

