name: CISA KEV security gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  kev:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11.11"
          cache: pip
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest==8.3.5
      - name: Run focused KEV tests
        run: python -m pytest -q tests/test_kev_gate.py
      - name: Run mandatory KEV scan
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/kev_gate.py --root . --commit-sha "$GITHUB_SHA" --output artifacts/kev/kev_report.json
      - name: Upload KEV evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: kev-report
          path: artifacts/kev/kev_report.json

