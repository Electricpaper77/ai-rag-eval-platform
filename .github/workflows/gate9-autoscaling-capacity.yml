name: Gate 9 Autoscaling Capacity

on:
  push:
    branches: [feature/gate9-autoscaling-capacity]
    paths:
      - ".github/workflows/gate9-autoscaling-capacity.yml"
      - "backend/app/capacity.py"
      - "backend/app/main.py"
      - "deploy/autoscaling/**"
      - "deploy/observability/gate9-*"
      - "scripts/gate9_*.py"
      - "tests/test_gate9_autoscaling.py"
      - "Dockerfile"
      - "requirements*.txt"
  workflow_dispatch:
    inputs:
      feature_sha:
        description: Exact feature commit SHA to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  gate9-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FEATURE_SHA: ${{ inputs.feature_sha || github.sha }}
      KIND_VERSION: v0.27.0
      METRICS_SERVER_VERSION: v0.7.2
      CLUSTER_NAME: agenttrust-gate9
      NAMESPACE: gate9-capacity
      IMAGE: agenttrust-iq:gate9
      SERVICE_URL: http://gate9-serving:8080

    steps:
      - name: Checkout exact feature SHA
        uses: actions/checkout@v4
        with:
          repository: Electricpaper77/ai-rag-eval-platform
          ref: ${{ env.FEATURE_SHA }}
          fetch-depth: 0

      - name: Validate repository identity and SHA
        run: |
          set -euo pipefail
          [[ "$FEATURE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$FEATURE_SHA"
          git cat-file -e "$FEATURE_SHA^{commit}"
          test "$(git remote get-url origin | sed 's#\.git$##')" = "https://github.com/Electricpaper77/ai-rag-eval-platform"
          mkdir -p artifacts/gate9
          { echo "repository=$(git remote get-url origin)"; echo "feature_sha=$FEATURE_SHA"; git show -s --format='commit=%H%nsubject=%s' "$FEATURE_SHA"; } | tee artifacts/gate9/identity.txt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies and run focused tests
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements-lite.txt
          python -m pytest -q tests/test_gate9_autoscaling.py | tee artifacts/gate9/focused-tests.txt

      - name: Validate manifests and alerts
        run: |
          set -euo pipefail
          python - <<'PY' | tee artifacts/gate9/static-validation.txt
          import json
          from pathlib import Path
          import yaml
          for name in ("deploy/autoscaling/gate9.yaml", "deploy/autoscaling/gate9-hpa.yaml", "deploy/observability/gate9-alerts.yaml"):
              docs = [x for x in yaml.safe_load_all(Path(name).read_text()) if x]
              assert docs, name
              print(name, len(docs), "documents")
          json.loads(Path("deploy/observability/gate9-dashboard.json").read_text())
          print("YAML_JSON: PASS")
          PY
          git diff --check | tee artifacts/gate9/diff-check.txt

      - name: Install pinned kind
        run: |
          set -euo pipefail
          curl -fsSLo kind-linux-amd64 "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          curl -fsSLo kind.sha256sum "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64.sha256sum"
          sha256sum -c kind.sha256sum
          mkdir -p "$HOME/.local/bin"
          install -m 0755 kind-linux-amd64 "$HOME/.local/bin/kind"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          kind version | tee artifacts/gate9/kind-version.txt

      - name: Create kind cluster
        run: |
          set -euo pipefail
          kind create cluster --name "$CLUSTER_NAME" --wait 120s
          kubectl version --client=true | tee artifacts/gate9/kubectl-version.txt
          kubectl get nodes -o wide | tee artifacts/gate9/nodes.txt

      - name: Install pinned Metrics Server and prove kubectl top
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/kubernetes-sigs/metrics-server/releases/download/${METRICS_SERVER_VERSION}/components.yaml" -o artifacts/gate9/metrics-server.yaml
          kubectl apply -f artifacts/gate9/metrics-server.yaml
          kubectl patch deployment metrics-server -n kube-system --type=json -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"},{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-preferred-address-types=InternalIP,Hostname"}]'
          kubectl rollout status -n kube-system deployment/metrics-server --timeout=180s
          for _ in $(seq 1 30); do kubectl top pods -A > artifacts/gate9/top-pods.txt 2>&1 && break || sleep 5; done
          test -s artifacts/gate9/top-pods.txt
          cat artifacts/gate9/top-pods.txt

      - name: Build and load Gate 9 image
        run: |
          set -euo pipefail
          docker build -t "$IMAGE" . | tee artifacts/gate9/docker-build.txt
          kind load docker-image "$IMAGE" --name "$CLUSTER_NAME"
          docker image inspect "$IMAGE" --format '{{.Id}}' | tee artifacts/gate9/image-id.txt

      - name: Deploy serving, queue scaler and HPA
        run: |
          set -euo pipefail
          kubectl apply -f deploy/autoscaling/gate9-namespace.yaml
          kubectl wait --for=jsonpath='{.status.phase}'=Active namespace/"$NAMESPACE" --timeout=30s
          kubectl apply --dry-run=server -f deploy/autoscaling/gate9-namespace.yaml | tee artifacts/gate9/server-dry-run.txt
          kubectl apply --dry-run=server -f deploy/autoscaling/gate9.yaml | tee -a artifacts/gate9/server-dry-run.txt
          kubectl apply --dry-run=server -f deploy/autoscaling/gate9-hpa.yaml | tee -a artifacts/gate9/server-dry-run.txt
          kubectl apply -f deploy/autoscaling/gate9.yaml
          kubectl apply -f deploy/autoscaling/gate9-hpa.yaml
          kubectl rollout status -n "$NAMESPACE" deployment/gate9-serving --timeout=180s
          kubectl rollout status -n "$NAMESPACE" deployment/gate9-queue-scaler --timeout=180s
          kubectl get pods,deploy,svc,hpa,networkpolicy -n "$NAMESPACE" -o wide | tee artifacts/gate9/initial-state.txt

      - name: Prove baseline inference and capacity API
        run: |
          set -euo pipefail
          kubectl run -n "$NAMESPACE" gate9-approved-client --labels=app.kubernetes.io/part-of=agenttrust-iq --rm -i --restart=Never --image="$IMAGE" --image-pull-policy=Never -- python -c 'import json,urllib.request; h=urllib.request.urlopen("http://gate9-serving:8080/healthz",timeout=10); assert h.status==200; s=json.load(urllib.request.urlopen("http://gate9-serving:8080/platform/capacity/status")); q=urllib.request.Request("http://gate9-serving:8080/v1/chat/completions",data=json.dumps({"model":"mock","messages":[{"role":"user","content":"gate9 baseline"}]}).encode(),headers={"content-type":"application/json"}); b=json.load(urllib.request.urlopen(q,timeout=15)); assert b["choices"][0]["message"]["role"]=="assistant"; print("HEALTHZ",h.status); print("CAPACITY",s); print("CHAT",b)' | tee artifacts/gate9/baseline-inference.txt

      - name: Drive CPU load and prove HPA scale-up
        run: |
          set -euo pipefail
          kubectl set env -n "$NAMESPACE" deployment/gate9-serving GATE9_CPU_WORK_MS=150
          kubectl rollout status -n "$NAMESPACE" deployment/gate9-serving --timeout=180s
          kubectl apply -f - <<YAML
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: gate9-cpu-load
            namespace: $NAMESPACE
            labels: {app.kubernetes.io/part-of: agenttrust-iq}
          spec:
            backoffLimit: 0
            template:
              metadata: {labels: {app.kubernetes.io/part-of: agenttrust-iq}}
              spec:
                restartPolicy: Never
                containers:
                  - name: load
                    image: $IMAGE
                    imagePullPolicy: Never
                    command: ["python", "-m", "scripts.gate9_load", "--url", "$SERVICE_URL/v1/chat/completions", "--duration", "80", "--concurrency", "24"]
                    resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 200m, memory: 128Mi}}
          YAML
          scaled=false
          for _ in $(seq 1 36); do kubectl get hpa,deploy -n "$NAMESPACE" -o wide | tee artifacts/gate9/hpa-progress.txt; replicas=$(kubectl get deploy gate9-serving -n "$NAMESPACE" -o jsonpath='{.status.readyReplicas}'); [ "${replicas:-0}" -ge 2 ] && scaled=true && break; sleep 5; done
          test "$scaled" = true
          kubectl get hpa,deploy -n "$NAMESPACE" -o yaml | tee artifacts/gate9/hpa-scale-up.yaml
          kubectl wait -n "$NAMESPACE" --for=condition=complete job/gate9-cpu-load --timeout=120s
          kubectl logs -n "$NAMESPACE" job/gate9-cpu-load | tee artifacts/gate9/cpu-load.txt

      - name: Prove queue scaling and structured backpressure
        run: |
          set -euo pipefail
          kubectl set env -n "$NAMESPACE" deployment/gate9-serving GATE9_CPU_WORK_MS=500 GATE9_MAX_INFLIGHT_PER_REPLICA=1 GATE9_QUEUE_CAPACITY=1
          kubectl rollout status -n "$NAMESPACE" deployment/gate9-serving --timeout=180s
          kubectl delete job -n "$NAMESPACE" gate9-cpu-load --ignore-not-found
          kubectl apply -f - <<YAML
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: gate9-queue-load
            namespace: $NAMESPACE
            labels: {app.kubernetes.io/part-of: agenttrust-iq}
          spec:
            backoffLimit: 0
            template:
              metadata: {labels: {app.kubernetes.io/part-of: agenttrust-iq}}
              spec:
                restartPolicy: Never
                containers:
                  - name: load
                    image: $IMAGE
                    imagePullPolicy: Never
                    command: ["python", "-m", "scripts.gate9_load", "--url", "$SERVICE_URL/v1/chat/completions", "--duration", "40", "--concurrency", "20"]
                    resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 200m, memory: 128Mi}}
          YAML
          backpressure=false
          kubectl run -n "$NAMESPACE" gate9-backpressure --labels=app.kubernetes.io/part-of=agenttrust-iq --rm -i --restart=Never --image="$IMAGE" --image-pull-policy=Never -- python -m scripts.gate9_backpressure --url "$SERVICE_URL/v1/chat/completions" --requests 24 | tee artifacts/gate9/backpressure.txt
          kubectl get deploy gate9-serving -n "$NAMESPACE" -o jsonpath='{.spec.replicas}' | tee artifacts/gate9/queue-scale-replicas.txt
          kubectl run -n "$NAMESPACE" gate9-metrics --labels=app.kubernetes.io/part-of=agenttrust-iq --rm -i --restart=Never --image="$IMAGE" --image-pull-policy=Never -- python -c 'import urllib.request; print(urllib.request.urlopen("http://gate9-serving:8080/metrics").read().decode())' | tee artifacts/gate9/capacity-metrics.txt

      - name: Prove scale-down and continuity
        run: |
          set -euo pipefail
          kubectl delete job -n "$NAMESPACE" gate9-queue-load --ignore-not-found --wait=true
          kubectl set env -n "$NAMESPACE" deployment/gate9-serving GATE9_CPU_WORK_MS=0 GATE9_MAX_INFLIGHT_PER_REPLICA=4 GATE9_QUEUE_CAPACITY=8
          kubectl rollout status -n "$NAMESPACE" deployment/gate9-serving --timeout=180s
          : > artifacts/gate9/scale-down.txt
          scaled_down=false
          for _ in $(seq 1 48); do
            kubectl get hpa,deploy -n "$NAMESPACE" -o wide | tee -a artifacts/gate9/scale-down.txt
            replicas=$(kubectl get deploy gate9-serving -n "$NAMESPACE" -o jsonpath='{.spec.replicas}')
            ready=$(kubectl get deploy gate9-serving -n "$NAMESPACE" -o jsonpath='{.status.readyReplicas}')
            if [ "${replicas:-0}" -eq 1 ] && [ "${ready:-0}" -eq 1 ]; then scaled_down=true; break; fi
            sleep 5
          done
          test "$scaled_down" = true
          kubectl run -n "$NAMESPACE" gate9-recovery-client --labels=app.kubernetes.io/part-of=agenttrust-iq --rm -i --restart=Never --image="$IMAGE" --image-pull-policy=Never -- python -c 'import json,urllib.request; q=urllib.request.Request("http://gate9-serving:8080/v1/chat/completions",data=json.dumps({"model":"mock","messages":[{"role":"user","content":"recovered"}]}).encode(),headers={"content-type":"application/json"}); r=urllib.request.urlopen(q,timeout=15); assert r.status==200; print("RECOVERY_CHAT",r.read().decode())' | tee artifacts/gate9/recovery.txt

      - name: Prove restrictive network policy and runtime security
        run: |
          set -euo pipefail
          kubectl create namespace gate9-denied
          if kubectl run -n gate9-denied gate9-denied-client --rm -i --restart=Never --image="$IMAGE" --image-pull-policy=Never -- python -c 'import urllib.request; urllib.request.urlopen("http://gate9-serving.gate9-capacity.svc.cluster.local:8080/healthz",timeout=5)'; then echo "NETWORK_POLICY_DENIED: FAIL"; exit 1; else echo "NETWORK_POLICY_DENIED: PASS" | tee artifacts/gate9/network-denied.txt; fi
          kubectl delete namespace gate9-denied --wait=true
          kubectl get deploy -n "$NAMESPACE" -o json > artifacts/gate9/deployments.json
          python - <<'PY'
          import json
          data=json.load(open("artifacts/gate9/deployments.json", encoding="utf-8"))
          for item in data["items"]:
              pod=item["spec"]["template"]["spec"]
              assert pod["securityContext"]["runAsNonRoot"] is True
              assert pod["securityContext"]["runAsUser"] == 10001 and pod["securityContext"]["runAsGroup"] == 10001
              assert pod["securityContext"]["seccompProfile"]["type"] == "RuntimeDefault"
              container=pod["containers"][0]
              assert container["securityContext"]["readOnlyRootFilesystem"] is True
              assert container["securityContext"]["allowPrivilegeEscalation"] is False
              assert container["securityContext"]["capabilities"]["drop"] == ["ALL"]
              assert container["resources"]["requests"] and container["resources"]["limits"]
          print("SECURITY: PASS")
          PY

      - name: Validate alert rules with pinned promtool
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/promtool -v "$PWD/deploy/observability:/rules:ro" prom/prometheus:v2.54.1 check rules /rules/gate9-alerts.yaml | tee artifacts/gate9/promtool.txt

      - name: Full regression suite
        run: python -m pytest -q | tee artifacts/gate9/full-regression.txt

      - name: Collect Gate 9 evidence
        if: always()
        run: |
          set +e
          mkdir -p artifacts/gate9
          kubectl get pods,deploy,svc,hpa,networkpolicy -n "$NAMESPACE" -o yaml > artifacts/gate9/final-resources.yaml 2>&1
          kubectl get events -n "$NAMESPACE" --sort-by=.lastTimestamp > artifacts/gate9/events.txt 2>&1
          kubectl logs -n "$NAMESPACE" deployment/gate9-serving --tail=500 > artifacts/gate9/serving-logs.txt 2>&1
          kubectl logs -n "$NAMESPACE" deployment/gate9-queue-scaler --tail=500 > artifacts/gate9/queue-scaler-logs.txt 2>&1
          kubectl describe pods -n "$NAMESPACE" > artifacts/gate9/pod-describe.txt 2>&1
          git status --short --branch > artifacts/gate9/git-status.txt 2>&1
          git log -1 --format='%H %s' > artifacts/gate9/git-head.txt 2>&1
          set -e

      - name: Upload Gate 9 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate9-autoscaling-capacity-evidence
          path: artifacts/gate9
          if-no-files-found: error

      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name "$CLUSTER_NAME"
