name: Gate 3B Helm Runtime

on:
  push:
    branches:
      - feature/gate3b-helm-runtime
    paths:
      - ".github/workflows/gate3b-helm-runtime.yml"
      - "deploy/helm/agenttrust/**"
      - "backend/**"
      - "scripts/**"
      - "tests/**"
      - "Dockerfile"
      - "requirements.txt"
  workflow_dispatch:
    inputs:
      feature_sha:
        description: Full feature commit SHA to validate; leave blank to use the selected ref
        required: false
        type: string

permissions:
  contents: read

jobs:
  gate3b-helm-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KIND_VERSION: v0.27.0
      HELM_VERSION: v3.22.0
      CLUSTER_NAME: agenttrust-gate3
      NAMESPACE: agenttrust-gate3
      RELEASE: agenttrust
      IMAGE: agenttrust-iq:gate3
    steps:
      - name: Checkout target commit
        uses: actions/checkout@v4
        with:
          repository: Electricpaper77/ai-rag-eval-platform
          ref: ${{ inputs.feature_sha || github.sha }}
          fetch-depth: 0

      - name: Validate checkout
        run: |
          set -euo pipefail
          requested="${{ inputs.feature_sha }}"
          if [[ -n "$requested" ]]; then
            [[ "$requested" =~ ^[0-9a-fA-F]{40}$ ]]
            test "$(git rev-parse HEAD)" = "$requested"
          fi
          test "$(git remote get-url origin | sed 's#\.git$##')" = "https://github.com/Electricpaper77/ai-rag-eval-platform"
          git rev-parse HEAD | tee gate3b-feature-sha.txt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install --no-cache-dir httpx==0.28.1

      - name: Install pinned kind
        run: |
          set -euo pipefail
          curl -fsSLo kind-linux-amd64 "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          curl -fsSLo kind.sha256sum "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64.sha256sum"
          sha256sum -c kind.sha256sum
          mkdir -p "$HOME/.local/bin"
          install -m 0755 kind-linux-amd64 "$HOME/.local/bin/kind"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/kind" version

      - name: Install pinned Helm
        run: |
          set -euo pipefail
          archive="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl -fsSLo "$archive" "https://get.helm.sh/$archive"
          curl -fsSLo "$archive.sha256sum" "https://get.helm.sh/$archive.sha256sum"
          sha256sum -c "$archive.sha256sum"
          tar -xzf "$archive"
          mkdir -p "$HOME/.local/bin"
          install -m 0755 linux-amd64/helm "$HOME/.local/bin/helm"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/helm" version

      - name: Create isolated kind cluster
        run: |
          set -euo pipefail
          kind create cluster --name "$CLUSTER_NAME" --wait 120s
          kubectl get nodes -o wide

      - name: Build and load AgentTrust image
        run: |
          set -euo pipefail
          docker build -t "$IMAGE" .
          kind load docker-image "$IMAGE" --name "$CLUSTER_NAME"

      - name: Helm lint and render
        run: |
          set -euo pipefail
          mkdir -p artifacts/gate3b
          helm lint deploy/helm/agenttrust | tee artifacts/gate3b/helm-lint.txt
          helm template "$RELEASE" deploy/helm/agenttrust             --namespace "$NAMESPACE"             --set image.repository=agenttrust-iq             --set image.tag=gate3             --set image.pullPolicy=Never             --set replicaCount=1             > artifacts/gate3b/rendered.yaml

      - name: Server-side dry run
        run: |
          set -euo pipefail
          kubectl create namespace "$NAMESPACE"
          kubectl apply --dry-run=server -f artifacts/gate3b/rendered.yaml | tee artifacts/gate3b/server-dry-run.txt

      - name: Helm install revision 1
        run: |
          set -euo pipefail
          helm install "$RELEASE" deploy/helm/agenttrust             --namespace "$NAMESPACE"             --set image.repository=agenttrust-iq             --set image.tag=gate3             --set image.pullPolicy=Never             --set replicaCount=1             --wait --timeout 180s | tee artifacts/gate3b/install.txt
          helm history "$RELEASE" -n "$NAMESPACE" | tee artifacts/gate3b/history-r1.txt
          kubectl rollout status -n "$NAMESPACE" deployment/"$RELEASE" --timeout=120s
          kubectl get deployment,pod,service,networkpolicy -n "$NAMESPACE" -o yaml > artifacts/gate3b/live-r1.yaml

      - name: Verify revision 1 inference
        run: |
          set -euo pipefail
          kubectl run -n "$NAMESPACE" gate3b-client-r1             --labels=app.kubernetes.io/part-of=agenttrust-iq             --rm -i --restart=Never             --image="$IMAGE" --image-pull-policy=Never             -- python -c "import json,urllib.request; h=urllib.request.urlopen('http://agenttrust:8080/healthz',timeout=10); assert h.status==200; print('healthz',h.status); q=urllib.request.Request('http://agenttrust:8080/v1/chat/completions',data=json.dumps({'model':'mock','messages':[{'role':'user','content':'gate3 install'}]}).encode(),headers={'content-type':'application/json'}); b=json.loads(urllib.request.urlopen(q,timeout=15).read()); assert b['choices'][0]['message']['role']=='assistant'; print('chat',b)"             | tee artifacts/gate3b/inference-r1.txt

      - name: Upgrade to revision 2
        run: |
          set -euo pipefail
          helm upgrade "$RELEASE" deploy/helm/agenttrust             --namespace "$NAMESPACE"             --set image.repository=agenttrust-iq             --set image.tag=gate3             --set image.pullPolicy=Never             --set replicaCount=2             --wait --timeout 180s | tee artifacts/gate3b/upgrade-r2.txt
          kubectl rollout status -n "$NAMESPACE" deployment/"$RELEASE" --timeout=120s
          kubectl wait -n "$NAMESPACE" --for=condition=Ready pod -l app.kubernetes.io/instance="$RELEASE" --timeout=120s
          ready="$(kubectl get deployment "$RELEASE" -n "$NAMESPACE" -o jsonpath='{.status.readyReplicas}')"
          test "$ready" = "2"
          echo "readyReplicas=$ready" | tee artifacts/gate3b/replicas-r2.txt
          helm history "$RELEASE" -n "$NAMESPACE" | tee artifacts/gate3b/history-r2.txt

      - name: Verify revision 2 inference
        run: |
          set -euo pipefail
          kubectl run -n "$NAMESPACE" gate3b-client-r2             --labels=app.kubernetes.io/part-of=agenttrust-iq             --rm -i --restart=Never             --image="$IMAGE" --image-pull-policy=Never             -- python -c "import json,urllib.request; h=urllib.request.urlopen('http://agenttrust:8080/healthz',timeout=10); assert h.status==200; q=urllib.request.Request('http://agenttrust:8080/v1/chat/completions',data=json.dumps({'model':'mock','messages':[{'role':'user','content':'gate3 upgrade'}]}).encode(),headers={'content-type':'application/json'}); b=json.loads(urllib.request.urlopen(q,timeout=15).read()); assert b['choices'][0]['message']['role']=='assistant'; print('healthz',h.status); print('chat',b)"             | tee artifacts/gate3b/inference-r2.txt

      - name: Create deterministic failed revision 3
        run: |
          set -euo pipefail
          set +e
          helm upgrade "$RELEASE" deploy/helm/agenttrust             --namespace "$NAMESPACE"             --set image.repository=agenttrust-iq             --set image.tag=gate3-missing             --set image.pullPolicy=Never             --set replicaCount=2             --wait --timeout 45s > artifacts/gate3b/upgrade-r3-bad.txt 2>&1
          rc=$?
          set -e
          cat artifacts/gate3b/upgrade-r3-bad.txt
          test "$rc" -ne 0
          echo "expected_failed_revision_exit=$rc" | tee artifacts/gate3b/failed-revision.txt
          helm history "$RELEASE" -n "$NAMESPACE" | tee artifacts/gate3b/history-r3-failed.txt
          kubectl get pods -n "$NAMESPACE" -o wide | tee artifacts/gate3b/pods-r3-failed.txt
          kubectl get events -n "$NAMESPACE" --sort-by=.lastTimestamp > artifacts/gate3b/events-r3-failed.txt

      - name: Roll back to revision 2
        run: |
          set -euo pipefail
          start="$(date +%s)"
          helm rollback "$RELEASE" 2 -n "$NAMESPACE" --wait --timeout 180s | tee artifacts/gate3b/rollback.txt
          kubectl rollout status -n "$NAMESPACE" deployment/"$RELEASE" --timeout=120s
          ready="$(kubectl get deployment "$RELEASE" -n "$NAMESPACE" -o jsonpath='{.status.readyReplicas}')"
          test "$ready" = "2"
          end="$(date +%s)"
          echo "rollback_recovery_seconds=$((end-start))" | tee artifacts/gate3b/rollback-recovery.txt
          echo "readyReplicas=$ready" | tee -a artifacts/gate3b/rollback-recovery.txt
          helm history "$RELEASE" -n "$NAMESPACE" | tee artifacts/gate3b/history-post-rollback.txt

      - name: Verify post-rollback inference
        run: |
          set -euo pipefail
          kubectl run -n "$NAMESPACE" gate3b-client-rollback             --labels=app.kubernetes.io/part-of=agenttrust-iq             --rm -i --restart=Never             --image="$IMAGE" --image-pull-policy=Never             -- python -c "import json,urllib.request; h=urllib.request.urlopen('http://agenttrust:8080/healthz',timeout=10); assert h.status==200; q=urllib.request.Request('http://agenttrust:8080/v1/chat/completions',data=json.dumps({'model':'mock','messages':[{'role':'user','content':'gate3 rollback'}]}).encode(),headers={'content-type':'application/json'}); b=json.loads(urllib.request.urlopen(q,timeout=15).read()); assert b['choices'][0]['message']['role']=='assistant'; print('healthz',h.status); print('chat',b)"             | tee artifacts/gate3b/inference-post-rollback.txt

      - name: Verify live security controls
        run: |
          set -euo pipefail
          kubectl get deployment "$RELEASE" -n "$NAMESPACE" -o json > artifacts/gate3b/deployment.json
          python - <<'PY' | tee artifacts/gate3b/security-check.txt
          import json
          d=json.load(open("artifacts/gate3b/deployment.json", encoding="utf-8"))
          spec=d["spec"]["template"]["spec"]
          c=spec["containers"][0]
          assert spec["automountServiceAccountToken"] is False
          assert spec["securityContext"]["runAsNonRoot"] is True
          assert spec["securityContext"]["runAsUser"] == 10001
          assert spec["securityContext"]["runAsGroup"] == 10001
          assert spec["securityContext"]["seccompProfile"]["type"] == "RuntimeDefault"
          assert c["securityContext"]["readOnlyRootFilesystem"] is True
          assert c["securityContext"]["allowPrivilegeEscalation"] is False
          assert c["securityContext"]["capabilities"]["drop"] == ["ALL"]
          assert c["resources"]["requests"]
          assert c["resources"]["limits"]
          print("SECURITY_CONTROLS_PASS")
          PY

      - name: Collect final evidence
        if: always()
        run: |
          mkdir -p artifacts/gate3b
          helm history "$RELEASE" -n "$NAMESPACE" > artifacts/gate3b/history-final.txt 2>&1 || true
          kubectl get all,networkpolicy,pvc -n "$NAMESPACE" -o yaml > artifacts/gate3b/final-resources.yaml 2>&1 || true
          kubectl get events -n "$NAMESPACE" --sort-by=.lastTimestamp > artifacts/gate3b/events-final.txt 2>&1 || true

      - name: Upload Gate 3B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate3b-helm-runtime-evidence
          path: artifacts/gate3b
