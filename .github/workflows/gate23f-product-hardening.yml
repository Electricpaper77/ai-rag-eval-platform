name: Gate 23F Product Hardening
on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "saas/**"
      - "tests/test_gate23*.py"
      - "tests/test_gate23f*.py"
      - "requirements-test.txt"
      - ".github/workflows/gate23f-product-hardening.yml"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  product-hardening:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: gate23f
          POSTGRES_DB: agenttrust
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d agenttrust"
          --health-interval=5s --health-timeout=5s --health-retries=24
    env:
      AGENTTRUST_POSTGRES_URL: postgresql://postgres:gate23f@localhost:5432/agenttrust
      AGENTTRUST_SAAS_DB: ""
      AGENTTRUST_SAAS_BACKEND: postgres
      AGENTTRUST_DEPLOYMENT_POLICY: test
      AGENTTRUST_SAAS_RUNTIME_MODE: test
      GATE23F_EVIDENCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: Install shared test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt playwright
      - name: Install Chromium and axe-core
        run: |
          python -m playwright install --with-deps chromium
          npm install --no-save --ignore-scripts axe-core@4.10.2
      - name: Apply versioned PostgreSQL migrations
        run: python -c "from saas.postgres_repository import migrate; migrate()"
      - name: Initialize sanitized evidence
        run: |
          mkdir -p artifacts/gate23f
          printf '{"schema":"gate23f-evidence-v1","status":"started","synthetic_only":true,"commit_sha":"%s"}\n' "$GATE23F_EVIDENCE_SHA" > artifacts/gate23f/run-state.json
      - name: Run Gate 23F contract tests
        run: timeout 120s python -m pytest -q tests/test_gate23f_contract.py --maxfail=1
      - name: Require browser and accessibility dependencies
        run: python -c "import playwright; from pathlib import Path; assert Path('node_modules/axe-core/axe.min.js').exists()"
      - name: Run mandatory PostgreSQL Chromium hardening tests
        run: timeout 420s python -m pytest -q tests/test_gate23f_browser.py -m postgres_integration --maxfail=1
      - name: Verify screenshots and manifest
        run: |
          test -f artifacts/gate23f/accessibility.json
          test -f artifacts/gate23f/run-state.json
          test "$(find artifacts/gate23f -name 'gate23f-*.png' | wc -l)" -eq 4
      - name: Upload sanitized Gate 23F evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate23f-product-hardening-evidence
          path: artifacts/gate23f/
          if-no-files-found: error
