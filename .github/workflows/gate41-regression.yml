name: Gates 39-41 Ubuntu regression

on:
  workflow_dispatch:
  push:
    branches:
      - gate41-benchmark-review
    paths:
      - .github/workflows/gate41-regression.yml

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install application and test dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir -r requirements-lite.txt
          python -m pip install --disable-pip-version-check --no-cache-dir \
            chromadb==0.4.24 prometheus-client==0.20.0 numpy==1.26.4
          python -m pip install --disable-pip-version-check --no-cache-dir pytest httpx

      - name: Capture source and resolved environment
        run: |
          mkdir -p work/gate41-regression
          printf 'source_sha=%s\n' "$GITHUB_SHA" | tee work/gate41-regression/source-sha.txt
          python --version | tee work/gate41-regression/python-version.txt
          python -m pip freeze | tee work/gate41-regression/pip-freeze.txt

      - name: Run Gates 39-41 regression suites
        id: pytest
        shell: bash
        run: |
          set +e
          python -m pytest -q \
            tests/test_stdlib_platform_resolution.py \
            tests/test_kev_gate.py \
            tests/test_gate39_reliability_benchmark.py \
            tests/test_quality_latency_economics_benchmark.py \
            tests/test_reliability_engineering.py \
            tests/test_eval_compare.py \
            --junitxml=work/gate41-regression/pytest-junit.xml 2>&1 | tee work/gate41-regression/pytest-output.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate41-regression-${{ github.sha }}
          path: work/gate41-regression/
          if-no-files-found: error
