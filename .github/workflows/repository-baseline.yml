name: Repository Baseline

on:
  push:
    branches:
      - fix/repository-test-baseline
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Install test dependencies
        run: python -m pip install pytest pytest-cov
      - name: Record environment
        run: |
          python --version
          python -m pip freeze
          mkdir -p artifacts/baseline
          python -m pip freeze > artifacts/baseline/pip-freeze.txt
      - name: Run complete pytest suite
        id: full_pytest
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -ra --tb=short 2>&1 | tee artifacts/baseline/full-pytest.log
      - name: Run focused recruiter evidence tests
        if: always()
        run: |
          set -o pipefail
          if [[ -f tests/test_recruiter_evidence.py && -f tests/test_nvidia_eval_pack.py ]]; then
            python -m pytest tests/test_recruiter_evidence.py tests/test_nvidia_eval_pack.py -q 2>&1 | tee artifacts/baseline/recruiter-evidence-tests.log
          else
            echo "Skipped: recruiter evidence tests are introduced by PR #90 and are not present on this isolated main-based branch." | tee artifacts/baseline/recruiter-evidence-tests.log
          fi
      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-baseline-results
          path: artifacts/baseline
          if-no-files-found: error
      - name: Fail when complete suite failed
        if: steps.full_pytest.outcome == 'failure'
        run: exit 1
