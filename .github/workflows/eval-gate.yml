name: Eval Gate

on:
  push:
    branches: [ main, project3-infra-observability ]
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start API (background)
        run: |
          nohup uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 > runs/uvicorn.log 2>&1 &
          python - <<'PY'
          import time, requests
          url="http://127.0.0.1:8000/health"
          for i in range(30):
              try:
                  r=requests.get(url,timeout=2)
                  print("health:", r.status_code, r.text)
                  if r.status_code==200:
                      raise SystemExit(0)
              except Exception as e:
                  print("wait...", e)
              time.sleep(1)
          raise SystemExit("API did not become healthy")
          PY

      - name: Run CI eval gate
        run: |
          python scripts/ci_eval.py
        env:
          SERVICE_URL: http://127.0.0.1:8000

      - name: Upload CI metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-metrics
          path: runs/ci_metrics.json

      - name: Upload API log (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uvicorn-log
          path: runs/uvicorn.log
