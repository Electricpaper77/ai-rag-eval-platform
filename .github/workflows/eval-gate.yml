name: Eval Gate

on:
  push:
    branches: [ main, project3-infra-observability ]
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run smoke eval
        run: |
          python -m pytest -q

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: .
