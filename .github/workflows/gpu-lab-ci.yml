name: GPU Lab Offline Validation

on:
  pull_request:
    paths:
      - "gpu_lab/**"
      - "nvidia_eval/**"
      - "eval/nvidia_nemotron_pack.jsonl"
      - "tests/test_gpu_lab.py"
      - "tests/test_nvidia_eval_pack.py"
      - "tests/fixtures/**"
      - "backend/app/routes/gpu_lab.py"
      - "backend/app/routes/nvidia_evaluation.py"
      - "docs/GPU_*.md"
      - ".env.example"
      - "scripts/validate_nvidia_eval_pack.py"
      - ".github/workflows/gpu-lab-ci.yml"
  workflow_dispatch:

jobs:
  gpu-lab-offline-validation:
    name: GPU Lab Offline Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lite.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-lite.txt
      - run: python -m pytest tests/test_gpu_lab.py -q
      - run: python scripts/validate_nvidia_eval_pack.py
      - run: git diff --check
