name: GPU Lab Offline Validation

on:
  pull_request:
    paths:
      - "gpu_lab/**"
      - "nvidia_eval/**"
      - "eval/nvidia_nemotron_pack.jsonl"
      - "tests/test_gpu_lab.py"
      - "tests/test_nvidia_eval_pack.py"
      - "tests/fixtures/**"
      - "backend/app/routes/gpu_lab.py"
      - "backend/app/routes/nvidia_evaluation.py"
      - "docs/GPU_*.md"
      - ".env.example"
      - "scripts/validate_nvidia_eval_pack.py"
      - ".github/workflows/gpu-lab-ci.yml"
  workflow_dispatch:

jobs:
  gpu-lab-offline-validation:
    name: GPU Lab Offline Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lite.txt
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install offline test dependencies
        run: python -m pip install -r requirements-lite.txt "pytest>=8,<9"
      - name: Run GPU Lab tests
        run: python -m pytest tests/test_gpu_lab.py -q
      - name: Validate NVIDIA evaluation pack
        if: always()
        run: python scripts/validate_nvidia_eval_pack.py
      - name: Check PR diff whitespace
        if: always()
        run: git diff --check origin/main...HEAD
