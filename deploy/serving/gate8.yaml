kind: Deployment
metadata:
  name: gate8-candidate
  namespace: gate8-serving
  labels:
    app.kubernetes.io/name: gate8-candidate
    app.kubernetes.io/part-of: agenttrust-iq
    agenttrust.ai/model-version: candidate
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gate8-candidate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gate8-candidate
        app.kubernetes.io/part-of: agenttrust-iq
        agenttrust.ai/model-version: candidate
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
