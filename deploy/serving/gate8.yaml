---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gate8-router-policy
  namespace: gate8-serving
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gate8-router
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/part-of: agenttrust-iq
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gate8-baseline
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gate8-candidate
      ports: [{protocol: TCP, port: 8080}]
    - to: [{namespaceSelector: {}}]
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gate8-serving-policy
  namespace: gate8-serving
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [gate8-baseline, gate8-candidate]
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gate8-router
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to: [{namespaceSelector: {}}]
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
