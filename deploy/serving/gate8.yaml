              containerPort: 8080
          env:
            - name: GATE8_MODEL_VERSION
              value: candidate
            - name: GATE8_RUNTIME
              value: mock
            - name: GATE8_FORCE_LATENCY_MS
              value: "0"
            - name: GATE8_FORCE_ERROR_RATE
