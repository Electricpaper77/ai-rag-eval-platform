apiVersion: v1
kind: Namespace
metadata:
  name: gate8-serving
  labels:
    app.kubernetes.io/part-of: agenttrust-iq
---
apiVersion: v1
kind: Service
metadata:
  name: gate8-router
  namespace: gate8-serving
  labels:
    app.kubernetes.io/name: gate8-router
    app.kubernetes.io/part-of: agenttrust-iq
spec:
  selector:
    app.kubernetes.io/name: gate8-router
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: gate8-baseline
  namespace: gate8-serving
  labels:
    app.kubernetes.io/name: gate8-baseline
    app.kubernetes.io/part-of: agenttrust-iq
spec:
  selector:
    app.kubernetes.io/name: gate8-baseline
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: gate8-candidate
  namespace: gate8-serving
  labels:
    app.kubernetes.io/name: gate8-candidate
    app.kubernetes.io/part-of: agenttrust-iq
spec:
  selector:
    app.kubernetes.io/name: gate8-candidate
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gate8-router
  namespace: gate8-serving
  labels:
    app.kubernetes.io/name: gate8-router
    app.kubernetes.io/part-of: agenttrust-iq
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gate8-router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gate8-router
        app.kubernetes.io/part-of: agenttrust-iq
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: router
          image: agenttrust-iq:gate8
          imagePullPolicy: Never
          command: ["python", "-m", "scripts.gate8_router"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: GATE8_BASELINE_ENDPOINT
              value: http://gate8-baseline:8080
            - name: GATE8_CANDIDATE_ENDPOINT
              value: http://gate8-candidate:8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gate8-baseline
  namespace: gate8-serving
  labels:
    app.kubernetes.io/name: gate8-baseline
    app.kubernetes.io/part-of: agenttrust-iq
    agenttrust.ai/model-version: baseline
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gate8-baseline
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gate8-baseline
        app.kubernetes.io/part-of: agenttrust-iq
        agenttrust.ai/model-version: baseline
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: serving
          image: agenttrust-iq:gate8
          imagePullPolicy: Never
          command: ["python", "-m", "scripts.gate8_model_server"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: GATE8_MODEL_VERSION
              value: baseline
            - name: GATE8_RUNTIME
