server:
  global:
    scrape_interval: 5s
    scrape_timeout: 4s
    evaluation_interval: 5s
  persistentVolume:
    enabled: false
  retention: 2h
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

serverFiles:
  prometheus.yml:
    rule_files:
      - /etc/config/alerting_rules.yml

extraScrapeConfigs: |
  - job_name: agenttrust
    metrics_path: /metrics
    static_configs:
      - targets:
          - agenttrust.agenttrust.svc.cluster.local:8080
        labels:
          namespace: agenttrust
          app: agenttrust

