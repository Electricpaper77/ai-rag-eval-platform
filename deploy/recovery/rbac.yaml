apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agenttrust-recovery-observer
  namespace: agenttrust-recovery
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agenttrust-recovery-observer
  namespace: agenttrust-recovery
subjects:
  - kind: ServiceAccount
    name: agenttrust-recovery
    namespace: agenttrust-recovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agenttrust-recovery-observer
