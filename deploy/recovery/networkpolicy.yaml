apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agenttrust-recovery
  namespace: agenttrust-recovery
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agenttrust-recovery
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: agenttrust-iq
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agenttrust-recovery
      ports:
        - protocol: TCP
          port: 8080
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
