apiVersion: v1
kind: Service
metadata:
  name: gate10-serving
  namespace: gate10-resilience
  labels: {app.kubernetes.io/name: gate10-serving, app.kubernetes.io/part-of: agenttrust-iq}
spec:
  selector: {app.kubernetes.io/name: gate10-serving}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gate10-serving
  namespace: gate10-resilience
  labels: {app.kubernetes.io/name: gate10-serving, app.kubernetes.io/part-of: agenttrust-iq}
spec:
  replicas: 3
  selector:
    matchLabels: {app.kubernetes.io/name: gate10-serving}
  template:
    metadata:
      labels: {app.kubernetes.io/name: gate10-serving, app.kubernetes.io/part-of: agenttrust-iq}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: serving
          image: agenttrust-iq:gate10
          imagePullPolicy: Never
          command: ["python", "-m", "scripts.gate10_server"]
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: GATE10_ENABLE_FAULTS, value: "true"}
            - {name: GATE10_DEPENDENCY_URL, value: http://gate10-dependency:8081/healthz}
            - {name: GATE9_MAX_INFLIGHT_PER_REPLICA, value: "4"}
            - {name: GATE9_QUEUE_CAPACITY, value: "8"}
            - {name: INFERENCE_LOG_PATH, value: /tmp/inference_runs.jsonl}
            - {name: INFERENCE_ARTIFACTS_ROOT, value: /tmp/inference_events}
            - {name: AGENTTRUST_ARTIFACT_DIR, value: /tmp/artifacts}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: gate10-dependency
  namespace: gate10-resilience
  labels: {app.kubernetes.io/name: gate10-dependency, app.kubernetes.io/part-of: agenttrust-iq}
spec:
  selector: {app.kubernetes.io/name: gate10-dependency}
  ports: [{name: http, port: 8081, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gate10-dependency
  namespace: gate10-resilience
  labels: {app.kubernetes.io/name: gate10-dependency, app.kubernetes.io/part-of: agenttrust-iq}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: gate10-dependency}
  template:
    metadata: {labels: {app.kubernetes.io/name: gate10-dependency, app.kubernetes.io/part-of: agenttrust-iq}}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: dependency
          image: agenttrust-iq:gate10
          imagePullPolicy: Never
          command: ["python", "-m", "scripts.gate10_dependency"]
          ports: [{name: http, containerPort: 8081}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 100m, memory: 128Mi}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gate10-serving-policy
  namespace: gate10-resilience
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: gate10-serving}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/part-of: agenttrust-iq}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: observability}}
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: gate10-dependency}}}]
      ports: [{protocol: TCP, port: 8081}]
    - to: [{namespaceSelector: {}}]
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gate10-dependency-policy
  namespace: gate10-resilience
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: gate10-dependency}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/name: gate10-serving}}}]
      ports: [{protocol: TCP, port: 8081}]
  egress:
    - to: [{namespaceSelector: {}}]
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
