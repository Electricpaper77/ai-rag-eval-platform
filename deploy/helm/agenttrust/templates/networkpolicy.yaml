{{- if .Values.networkPolicy.enabled }}
{{- $fullName := include "agenttrust.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullName }}-default-deny
  labels:
    {{- include "agenttrust.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agenttrust.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: agenttrust-iq
      ports:
        - protocol: TCP
          port: 8080
    {{- if .Values.observability.metrics.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.observability.monitoringNamespace | quote }}
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
