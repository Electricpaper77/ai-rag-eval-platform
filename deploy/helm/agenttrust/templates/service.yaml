{{- $fullName := include "agenttrust.fullname" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "agenttrust.labels" . | nindent 4 }}
  {{- if .Values.observability.metrics.enabled }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: {{ .Values.observability.metrics.path | quote }}
    prometheus.io/port: {{ .Values.observability.metrics.port | quote }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "agenttrust.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
