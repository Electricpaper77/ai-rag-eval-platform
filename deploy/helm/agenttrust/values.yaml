replicaCount: 1

image:
  repository: agenttrust-iq
  tag: gate2
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

gpu:
  count: 0
  resourceKey: amd.com/gpu

nodeSelector: {}
tolerations: []
priorityClassName: ""

persistence:
  enabled: false
  size: 1Gi
  storageClass: ""

inference:
  artifactRoot: /tmp/inference_events
  logPath: /tmp/inference_runs.jsonl

env: {}

observability:
  metrics:
    enabled: false
    path: /metrics
    port: 8080
  monitoringNamespace: observability

networkPolicy:
  enabled: true
