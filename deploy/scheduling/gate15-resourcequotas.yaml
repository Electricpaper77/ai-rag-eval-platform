apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-standard-quota
  namespace: tenant-standard
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: 512Mi
    limits.cpu: "1"
    limits.memory: 1Gi
    pods: "8"
    secrets: "8"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-priority-quota
  namespace: tenant-priority
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    pods: "8"
    secrets: "8"
