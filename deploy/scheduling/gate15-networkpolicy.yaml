apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tenant-standard-agenttrust
  namespace: tenant-standard
spec:
  podSelector:
    matchLabels:
      app: agenttrust-gate15
      tenant: standard
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              tenant: standard
          podSelector:
            matchLabels:
              tenant: standard
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              tenant: standard
          podSelector:
            matchLabels:
              tenant: standard
      ports:
        - protocol: TCP
          port: 8080
---
