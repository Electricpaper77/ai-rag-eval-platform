apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gate9-serving
  namespace: gate9-capacity
  labels:
    app.kubernetes.io/part-of: agenttrust-iq
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gate9-serving
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 40
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 30
      selectPolicy: Min
      policies:
        - type: Percent
          value: 25
          periodSeconds: 30
