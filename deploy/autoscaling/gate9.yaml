apiVersion: v1
kind: Namespace
metadata:
  name: gate9-capacity
  labels:
    app.kubernetes.io/part-of: agenttrust-iq
---
apiVersion: v1
kind: Service
metadata:
  name: gate9-serving
  namespace: gate9-capacity
  labels:
    app.kubernetes.io/name: gate9-serving
    app.kubernetes.io/part-of: agenttrust-iq
spec:
  selector:
    app.kubernetes.io/name: gate9-serving
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gate9-serving
  namespace: gate9-capacity
  labels:
    app.kubernetes.io/name: gate9-serving
    app.kubernetes.io/part-of: agenttrust-iq
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gate9-serving
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gate9-serving
        app.kubernetes.io/part-of: agenttrust-iq
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: serving
          image: agenttrust-iq:gate9
          imagePullPolicy: Never
          command: ["python", "-m", "scripts.gate9_server"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: GATE9_CPU_WORK_MS
              value: "0"
            - name: GATE9_MAX_INFLIGHT_PER_REPLICA
              value: "4"
            - name: GATE9_QUEUE_CAPACITY
              value: "8"
            - name: INFERENCE_LOG_PATH
              value: /tmp/inference_runs.jsonl
            - name: INFERENCE_ARTIFACTS_ROOT
              value: /tmp/inference_events
            - name: AGENTTRUST_ARTIFACT_DIR
              value: /tmp/artifacts
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 3
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gate9-queue-scaler
  namespace: gate9-capacity
  labels:
    app.kubernetes.io/part-of: agenttrust-iq
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gate9-queue-scaler
  namespace: gate9-capacity
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gate9-queue-scaler
  namespace: gate9-capacity
subjects:
  - kind: ServiceAccount
    name: gate9-queue-scaler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gate9-queue-scaler
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gate9-queue-scaler
  namespace: gate9-capacity
  labels:
    app.kubernetes.io/name: gate9-queue-scaler
    app.kubernetes.io/part-of: agenttrust-iq
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gate9-queue-scaler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gate9-queue-scaler
        app.kubernetes.io/part-of: agenttrust-iq
    spec:
      serviceAccountName: gate9-queue-scaler
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: queue-scaler
          image: agenttrust-iq:gate9
          imagePullPolicy: Never
          command: ["python", "-m", "scripts.gate9_queue_scaler"]
          env:
            - name: GATE9_NAMESPACE
              value: gate9-capacity
            - name: GATE9_SERVICE_URL
              value: http://gate9-serving:8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 100m, memory: 128Mi}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gate9-serving-policy
  namespace: gate9-capacity
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gate9-serving
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: agenttrust-iq
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to: [{namespaceSelector: {}}]
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gate9-queue-scaler-policy
  namespace: gate9-capacity
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gate9-queue-scaler
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gate9-serving
      ports: [{protocol: TCP, port: 8080}]
    - to: [{namespaceSelector: {}}]
      ports:
        - {protocol: TCP, port: 443}
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
