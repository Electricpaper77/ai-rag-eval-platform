apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gpu-workload-ingress-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gpu-inference-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: internal-platform
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 9090
