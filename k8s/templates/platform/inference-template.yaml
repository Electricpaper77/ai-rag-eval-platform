apiVersion: batch/v1
kind: Job
metadata:
  name: inference-job-template
spec:
  template:
    metadata:
      labels:
        app: gpu-platform-inference
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        accelerator: nvidia
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: inference
          image: nvcr.io/nvidia/tritonserver:24.01-py3
          command: ["python", "serve.py"]
          resources:
            requests:
              cpu: "4"
              memory: "16Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: "16Gi"
              nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
          livenessProbe:
            httpGet:
              path: /livez
              port: 8000
          volumeMounts:
            - name: model-cache
              mountPath: /models
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: gpu-platform-model-cache
