apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gpu-platform-network-policy
spec:
  podSelector:
    matchLabels:
      app: gpu-platform-inference
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform
      ports:
        - protocol: TCP
          port: 8000
