apiVersion: batch/v1
kind: Job
metadata:
  name: training-style-template
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        accelerator: nvidia
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: trainer
          image: pytorch/pytorch:2.2.1-cuda12.1-cudnn8-runtime
          command: ["python", "train.py", "--epochs", "3"]
          resources:
            requests:
              cpu: "16"
              memory: "64Gi"
              nvidia.com/gpu: "4"
            limits:
              cpu: "16"
              memory: "64Gi"
              nvidia.com/gpu: "4"
          readinessProbe:
            exec:
              command: ["sh", "-c", "test -f /tmp/training_ready"]
          livenessProbe:
            exec:
              command: ["sh", "-c", "ps aux | grep train.py"]
          volumeMounts:
            - name: checkpoints
              mountPath: /checkpoints
      volumes:
        - name: checkpoints
          persistentVolumeClaim:
            claimName: gpu-platform-training-pvc
