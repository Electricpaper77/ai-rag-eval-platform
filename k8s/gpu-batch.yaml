apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-batch-eval-job
  labels:
    workload-type: batch-eval
spec:
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        app: gpu-batch-eval
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        accelerator: nvidia
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: evaluator
          image: python:3.11-slim
          command: ["python", "scripts/run_eval.py"]
          resources:
            limits:
              nvidia.com/gpu: 1
              cpu: "4"
              memory: "16Gi"
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "test -f /tmp/ready"]
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "echo alive"]
          volumeMounts:
            - name: eval-data
              mountPath: /mnt/eval
      volumes:
        - name: eval-data
          persistentVolumeClaim:
            claimName: gpu-workload-pvc
