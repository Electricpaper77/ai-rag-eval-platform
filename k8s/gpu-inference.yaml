apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-inference-service
  labels:
    app.kubernetes.io/name: gpu-inference-service
    app.kubernetes.io/component: inference-api
    app.kubernetes.io/part-of: rag-eval-platform
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/environment: production
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: gpu-inference-service
      app.kubernetes.io/component: inference-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gpu-inference-service
        app.kubernetes.io/component: inference-api
        app.kubernetes.io/part-of: rag-eval-platform
        app.kubernetes.io/environment: production
    spec:
      containers:
        - name: fastapi-inference
          image: your-registry/fastapi-inference:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
              nvidia.com/gpu: 1
          env:
            - name: PORT
              value: "8000"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: gpu-inference-service
  labels:
    app.kubernetes.io/name: gpu-inference-service
    app.kubernetes.io/component: inference-api
    app.kubernetes.io/part-of: rag-eval-platform
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/environment: production
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gpu-inference-service
    app.kubernetes.io/component: inference-api
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
