apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gpu-inference-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nvidia-dynamo-triton
  minReplicas: 1
  maxReplicas: 12
  metrics:
  - type: Pods
    pods:
      metric:
        name: gpu_platform_queue_depth
      target:
        type: AverageValue
        averageValue: "20"
  - type: Pods
    pods:
      metric:
        name: gpu_platform_latency_ms
      target:
        type: AverageValue
        averageValue: "1500"
