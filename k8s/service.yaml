apiVersion: v1
kind: Service
metadata:
  name: ai-rag-eval-metrics
  labels:
    app.kubernetes.io/name: ai-rag-eval-api
    app.kubernetes.io/component: api
    monitoring: enabled
spec:
  selector:
    app.kubernetes.io/name: ai-rag-eval-api
    app.kubernetes.io/component: api
  ports:
    - name: http-metrics
      protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
