apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-eval-inference-api
  labels:
    app.kubernetes.io/name: rag-eval-inference-api
    app.kubernetes.io/component: serving
    app.kubernetes.io/part-of: ai-rag-eval-platform
    monitoring: enabled
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rag-eval-inference-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rag-eval-inference-api
        app.kubernetes.io/component: serving
        app.kubernetes.io/part-of: ai-rag-eval-platform
        monitoring: enabled
        tier: inference
    spec:
      containers:
        - name: api
          image: ghcr.io/example/ai-rag-eval-platform:latest
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
