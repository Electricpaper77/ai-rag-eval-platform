apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gpu-workload-isolation
spec:
  podSelector:
    matchLabels:
      app: gpu-inference
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: platform-system
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: model-services
      ports:
        - protocol: TCP
          port: 443
# Assumes a CNI plugin enforces Kubernetes NetworkPolicy for pod-level isolation.
