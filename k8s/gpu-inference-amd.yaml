apiVersion: apps/v1
kind: Deployment
metadata:
  name: amd-rocm-vllm
  labels:
    app: gpu-inference
    runtime: amd_vllm_rocm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gpu-inference
      runtime: amd_vllm_rocm
  template:
    metadata:
      labels:
        app: gpu-inference
        runtime: amd_vllm_rocm
    spec:
      nodeSelector:
        accelerator: amd
      containers:
      - name: vllm-rocm
        image: rocm/vllm:latest
        args: ["python", "-m", "vllm.entrypoints.openai.api_server", "--model", "meta-llama/Llama-3-8B-Instruct"]
        ports:
        - containerPort: 8000
        resources:
          limits:
            amd.com/gpu: "1"
            cpu: "8"
            memory: 32Gi
          requests:
            amd.com/gpu: "1"
            cpu: "4"
            memory: 16Gi
