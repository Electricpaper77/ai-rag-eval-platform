apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gpu-workload-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: "__STORAGE_CLASS__"
  resources:
    requests:
      storage: "__PVC_SIZE__"
# Assumes CSI dynamic provisioning is enabled for the selected storage class.
# Workloads mount the volume at __MOUNT_PATH__.
