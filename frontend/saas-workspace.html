<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgentTrust IQ Workspace</title><link rel="stylesheet" href="/styles.css"><style>
body{margin:0;background:#f6f8fb;color:#162033;font:15px system-ui,sans-serif}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#101a2c;color:#dce6f8;padding:24px}.side h1{font-size:20px}.demo{font-size:11px;color:#9fc4ff;border:1px solid #41628e;padding:4px 7px;border-radius:12px}.nav button{display:block;width:100%;margin-top:16px;padding:10px;text-align:left;border:0;background:transparent;color:inherit;border-radius:7px;cursor:pointer}.nav button:hover,.nav .active{background:#203451}.main{padding:32px;max-width:1100px}.top{display:flex;justify-content:space-between;gap:16px}.selects{display:flex;gap:8px}.selects select,.primary{padding:9px;border:1px solid #cbd5e1;border-radius:7px;background:#fff}.primary{background:#2563eb;color:#fff;border:0;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:24px 0}.card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:18px}.muted{color:#64748b}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid #e2e8f0}.status{color:#166534;background:#dcfce7;border-radius:12px;padding:3px 8px;font-size:12px}.notice{padding:12px;border-left:4px solid #f59e0b;background:#fffbeb}@media(max-width:760px){.shell{grid-template-columns:1fr}.nav{display:flex;gap:6px;overflow:auto}.nav button{margin:0;white-space:nowrap}.main{padding:20px}.grid{grid-template-columns:1fr}.top{flex-direction:column}}
</style></head><body><div class="shell"><aside class="side"><h1>AgentTrust IQ</h1><span class="demo">NON-PRODUCTION · SYNTHETIC DEMO</span><nav class="nav" aria-label="Workspace navigation"><button class="active" data-view="dashboard">Dashboard</button><button data-view="projects">Projects</button><button data-view="evaluations">Evaluations</button><button data-view="results">Results</button><button data-view="settings">Settings</button></nav></aside><main class="main"><div class="top"><div><h2 id="title">Workspace dashboard</h2><p class="muted">Evidence-backed evaluation quality gates for AI projects.</p></div><div class="selects"><select aria-label="Organization"><option>Synthetic Demo Organization</option></select><select aria-label="Project"><option>Groundedness Demo</option></select><button class="primary" id="newEval">New evaluation</button></div></div><div id="content"></div></main></div><script>
const content=document.getElementById('content'),title=document.getElementById('title');const data={dashboard:'<div class="notice"><b>Demo workspace:</b> records are synthetic and disposable. Metrics appear only after a persisted evaluation result exists.</div><div class="grid"><section class="card"><span class="muted">Projects</span><h3>1</h3></section><section class="card"><span class="muted">Evaluations</span><h3>0</h3><p class="muted">Loaded from API</p></section><section class="card"><span class="muted">Latest status</span><h3>Ready</h3><span class="status">No fabricated score</span></section></div><section class="card"><h3>Recent evaluations</h3><p class="muted">Create an evaluation to see persisted status and evidence.</p><button class="primary" onclick="show(\'evaluations\')">Open evaluations</button></section>',projects:'<section class="card"><h3>Projects</h3><p class="muted">Organization-scoped projects are authorized by FastAPI.</p><table class="table"><tr><th>Name</th><th>Organization</th><th>Status</th></tr><tr><td>Groundedness Demo</td><td>Synthetic Demo Organization</td><td><span class="status">Ready</span></td></tr></table></section>',evaluations:'<section class="card"><h3>Evaluation runs</h3><p class="muted">POST /saas/projects/{project_id}/evaluations creates a persisted synthetic run.</p><button class="primary" id="run">Submit synthetic evaluation</button><div id="runState" class="muted"></div></section>',results:'<section class="card"><h3>Results and evidence</h3><p class="muted">Pass/fail categories and latency render only from persisted API results.</p><div class="notice">No result selected. Run an evaluation first.</div></section>',settings:'<section class="card"><h3>Settings</h3><p class="muted">OIDC identity, membership and production readiness are API-controlled.</p></section>'};
function show(view){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));title.textContent=view[0].toUpperCase()+view.slice(1);content.innerHTML=data[view];if(view==='evaluations')document.getElementById('run').onclick=run}
async function run(){const state=document.getElementById('runState');state.textContent='Submitting through the authenticated API…';try{const r=await fetch('/saas/projects/synthetic-demo/evaluations',{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':'demo-'+Date.now()},body:'{"prompt":"synthetic groundedness check"}\n'});if(!r.ok)throw Error('API returned '+r.status);const row=await r.json();state.textContent='Persisted run '+row.id+' with provider '+row.provider+'. Open Results for source evidence.'}catch(e){state.textContent='Evaluation unavailable: '+e.message+' (authenticate through OIDC first).'}}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.view));document.getElementById('newEval').onclick=()=>show('evaluations');show('dashboard');
</script></body></html>
